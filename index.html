<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部材拾い出し＋Excel変換 v10.8</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:0;
  color:#111827;
}
.wrap{
  max-width:820px;
  margin:0 auto;
  padding:16px 16px 150px;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
label{
  font-weight:700;
  margin-top:10px;
  display:block;
}
input,select,button,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
  box-sizing:border-box;
}
button{
  background:#111827;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button.secondary{ background:#374151; }
button.ghost{
  background:#fff;
  color:#111;
  border:1px solid #e5e7eb;
}

/* 削除ボタン */
.deleteBtn{
  background:#ef4444;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px;
  margin-top:10px;
  font-weight:700;
  cursor:pointer;
  width:100%;
}
.deleteBtn:hover{ background:#dc2626; }

.small{
  font-size:12px;
  color:#6b7280;
  line-height:1.5;
}
.quickBtns{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:8px;
}
.item{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

/* フッター */
.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  border-top:1px solid #e5e7eb;
  padding:8px 12px;
  z-index:1000;
}
.footerRow{
  max-width:820px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.footerRow button{
  padding:8px 10px;
  font-size:14px;
  min-height:38px;
}
.summary{
  max-width:820px;
  margin:8px auto 0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}

/* 確認一覧 */
.review{
  margin-top:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  display:block;
}
.review table{
  width:100%;
  border-collapse:collapse;
}
.review th,.review td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  text-align:left;
}
.review .num{ text-align:right; }

.linkBox{
  margin-top:10px;
  padding:10px 12px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  word-break:break-all;
  display:none;
}

.notice{
  background:#eef2ff;
  border:1px solid #c7d2fe;
  border-radius:12px;
  padding:10px 12px;
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>
<div class="wrap">

  <!-- Excel読み込み -->
  <div class="card">
    <h2>部材拾い出し＋Excel変換</h2>
    <div class="small">
      画面表示・メール本文は短い名前を使用し、保存・共有するExcelでは元の長い名前を保持します。
    </div>

    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">

    <label>会社名</label>
    <input type="text" id="companyName" placeholder="例：株式会社○○">

    <button onclick="loadExcel()">Excelを読み込む</button>

    <div id="loadStatus" class="small" style="margin-top:8px"></div>
    <div id="saveStatus" class="small" style="margin-top:8px"></div>
    <div id="manualLinkBox" class="linkBox"></div>
  </div>

  <!-- 入力エリア -->
  <div class="card">
    <label>日付</label>
    <select id="dayPicker">
      <option value="5">5日</option>
      <option value="15">15日</option>
      <option value="25">25日</option>
    </select>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <div class="quickBtns">
      <button type="button" class="ghost quickAdd" data-add="5">+5</button>
      <button type="button" class="ghost quickAdd" data-add="10">+10</button>
      <button type="button" class="ghost quickAdd" data-add="100">+100</button>
      <button type="button" class="ghost quickAdd" data-add="200">+200</button>
      <button type="button" class="ghost quickAdd" data-add="305">+305</button>
    </div>

    <button id="addBtn">カートに入れる</button>
    <div class="notice">保存・共有するExcelは元の長い品目名のままです。</div>
  </div>

  <!-- カート -->
  <div class="card">
    <h3>カート</h3>
    <div id="cartList"></div>
  </div>

  <!-- 自動表示される確認一覧 -->
  <div class="card">
    <div id="reviewBox" class="review">
      <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
        <span>合計件数: <span id="reviewCount">0</span></span>
        <span>合計金額: <span id="reviewTotal">¥0</span></span>
      </div>

      <table>
        <thead>
          <tr>
            <th>品目名</th>
            <th>日付</th>
            <th class="num">数量</th>
            <th class="num">金額</th>
          </tr>
        </thead>
        <tbody id="reviewBody"></tbody>
      </table>

      <label style="margin-top:12px">メール本文</label>
      <textarea id="mailBody" rows="8"></textarea>
    </div>
  </div>
</div>

<!-- フッター -->
<div class="footer">
  <div class="footerRow">
    <button id="saveBtn" class="secondary">保存</button>
    <button id="shareBtn" class="ghost">ファイル共有</button>
  </div>
  <div class="footerRow" style="margin-top:8px">
    <button id="mailBtn" class="ghost">メール起動</button>
    <div></div>
  </div>
  <div class="summary">
    <span>合計金額</span>
    <span id="sumTotal">¥0</span>
  </div>
</div>

<script>
const FIXED_EMAIL = 'horus2018since@gmail.com';

/* 長い名前 → 短い名前の対応表（必要に応じて追加してください） */
const NAME_MAP = {
  "1G ﾌｨﾙﾀｰｽｲｯﾁ付き保安器/NH-K1FATT(lot:20)": "ﾌｨﾙﾀｰｽｲｯﾁ付き保安器",
  "1G 双方向1分岐型保安器/UJH7ACF(lot:50)": "1分岐型保安器",
  "1G 双方向2分配型保安器/UJH7ADF(lot:50)": "2分配型保安器"
};

function shortName(longName){
  return NAME_MAP[longName] || longName;
}

let workbook = null;
let items = [];
let cart = [];
let currentDownloadUrl = null;

function yen(n){
  return '¥' + Number(n || 0).toLocaleString('ja-JP');
}

function loadExcel(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){
    alert('元のExcelファイルを選択してください。');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    workbook = XLSX.read(e.target.result, {type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(sheet, {header:1});

    items = [];
    const groups = new Set();

    data.forEach((row, i) => {
      if(row[0] === '品目グループ名' || !row[2]) return;

      const longName = String(row[2]);
      items.push({
        rowNumber: i + 1,
        group: row[0],
        code: row[1],
        longName: longName,
        shortName: shortName(longName),
        price: Number(row[3] || 0)
      });

      if(row[0]) groups.add(row[0]);
    });

    document.getElementById('groupPicker').innerHTML =
      '<option value="">選択してください</option>' +
      [...groups].map(g => `<option value="${g}">${g}</option>`).join('');

    document.getElementById('loadStatus').textContent =
      `読込完了: ${items.length}件`;

    cart = [];
    renderCart();
    updateReview();
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('groupPicker').addEventListener('change', function(){
  const group = this.value;
  document.getElementById('itemPicker').innerHTML =
    items
      .filter(i => i.group === group)
      .map(i => `<option value="${i.rowNumber}">${i.shortName}</option>`)
      .join('');
});

document.getElementById('addBtn').addEventListener('click', function(){
  const rowNumber = Number(document.getElementById('itemPicker').value);
  const day = document.getElementById('dayPicker').value;
  const qty = Number(document.getElementById('qtyOne').value);

  const item = items.find(i => i.rowNumber === rowNumber);
  if(!item || !qty) return;

  let existing = cart.find(c => c.rowNumber === rowNumber);
  if(!existing){
    existing = {
      rowNumber: item.rowNumber,
      group: item.group,
      code: item.code,
      longName: item.longName,
      shortName: item.shortName,
      price: item.price,
      d5: 0,
      d15: 0,
      d25: 0
    };
    cart.push(existing);
  }

  existing['d' + day] += qty;
  document.getElementById('qtyOne').value = 0;

  renderCart();
  updateReview();
});

function removeFromCart(index){
  if(!confirm('この品目を削除しますか？')) return;
  cart.splice(index, 1);
  renderCart();
  updateReview();
}

document.querySelectorAll('.quickAdd').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById('qtyOne');
    input.value = Number(input.value || 0) + Number(btn.dataset.add);
  });
});

function renderCart(){
  const list = document.getElementById('cartList');

  list.innerHTML = cart.map((c, i) => {
    const qtyText = [];
    if(c.d5) qtyText.push(`5日:${c.d5}`);
    if(c.d15) qtyText.push(`15日:${c.d15}`);
    if(c.d25) qtyText.push(`25日:${c.d25}`);

    return `
      <div class="item">
        <strong>${c.shortName}</strong><br>
        <small>${c.group} / ${c.code}</small><br>
        数量: ${qtyText.join(' / ')}
        <button class="deleteBtn" onclick="removeFromCart(${i})">削除</button>
      </div>
    `;
  }).join('') || '<div class="small">まだ追加されていません。</div>';

  const total = cart.reduce(
    (s, c) => s + c.price * (c.d5 + c.d15 + c.d25),
    0
  );
  document.getElementById('sumTotal').textContent = yen(total);
}

function buildMailBody(){
  const company = document.getElementById('companyName').value || '';
  const total = cart.reduce(
    (s, c) => s + c.price * (c.d5 + c.d15 + c.d25),
    0
  );

  const lines = [
    'お世話になっております。',
    '',
    '以下の部材を発注いたします。',
    ''
  ];

  cart.forEach((c, i) => {
    const qtyText = [];
    if(c.d5) qtyText.push(`5日:${c.d5}`);
    if(c.d15) qtyText.push(`15日:${c.d15}`);
    if(c.d25) qtyText.push(`25日:${c.d25}`);
    lines.push(`${i+1}. ${c.shortName}（${qtyText.join(' / ')}）`);
  });

  lines.push(
    '',
    `合計件数: ${cart.length}`,
    `合計金額: ${yen(total)}`,
    '',
    company
  );

  return lines.join('\\n');
}

function updateReview(){
  const body = document.getElementById('reviewBody');
  const total = cart.reduce(
    (s, c) => s + c.price * (c.d5 + c.d15 + c.d25),
    0
  );

  document.getElementById('reviewCount').textContent = cart.length;
  document.getElementById('reviewTotal').textContent = yen(total);

  const rows = [];
  cart.forEach(c => {
    if(c.d5) rows.push(`<tr><td>${c.shortName}</td><td>5日</td><td class="num">${c.d5}</td><td class="num">${yen(c.price*c.d5)}</td></tr>`);
    if(c.d15) rows.push(`<tr><td>${c.shortName}</td><td>15日</td><td class="num">${c.d15}</td><td class="num">${yen(c.price*c.d15)}</td></tr>`);
    if(c.d25) rows.push(`<tr><td>${c.shortName}</td><td>25日</td><td class="num">${c.d25}</td><td class="num">${yen(c.price*c.d25)}</td></tr>`);
  });

  body.innerHTML = rows.join('') || '<tr><td colspan="4">データがありません。</td></tr>';
  document.getElementById('mailBody').value = buildMailBody();
}

function buildModifiedWorkbook(){
  if(!workbook) throw new Error('先にExcelを読み込んでください。');
  if(!cart.length) throw new Error('カートが空です。');

  const wb = XLSX.read(
    XLSX.write(workbook, {type:'array', bookType:'xlsx'}),
    {type:'array'}
  );
  const ws = wb.Sheets[wb.SheetNames[0]];

  const companyName = document.getElementById('companyName').value || '';
  if(companyName){
    ws['C1'] = {t:'s', v:companyName};
  }

  cart.forEach(c => {
    ws['E' + c.rowNumber] = {t:'n', v:c.d5 || 0};
    ws['F' + c.rowNumber] = {t:'n', v:c.d15 || 0};
    ws['G' + c.rowNumber] = {t:'n', v:c.d25 || 0};
  });

  return wb;
}

function makeFilename(){
  const file = document.getElementById('fileInput').files[0];
  const company = document.getElementById('companyName').value || '会社名なし';
  const base = file ? file.name.replace(/\.xlsx$/i,'').replace(/\.xlsm$/i,'') : '提出要部材購入';
  return `${base}_${company}_更新.xlsx`;
}

function saveFile(){
  const wb = buildModifiedWorkbook();
  XLSX.writeFile(wb, makeFilename());
}

async function shareFile(){
  const wb = buildModifiedWorkbook();
  const filename = makeFilename();
  const array = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([array], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = new File([blob], filename, {type: blob.type});

  if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({
      files:[file],
      title:'部材発注',
      text:buildMailBody()
    });
  } else {
    XLSX.writeFile(wb, filename);
  }
}

function launchMail(){
  const subject = '部材発注の件';
  const body = buildMailBody();
  window.location.href =
    `mailto:${FIXED_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

document.getElementById('saveBtn').addEventListener('click', saveFile);
document.getElementById('shareBtn').addEventListener('click', shareFile);
document.getElementById('mailBtn').addEventListener('click', launchMail);
</script>
</body>
</html>
