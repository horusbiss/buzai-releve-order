
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>提出要部材購入 変換ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; line-height: 1.5; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin-top: 10px; font-weight: 600; }
  input[type="file"], input[type="text"], select { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
  button { padding: 12px 18px; border: none; border-radius: 10px; background: #111; color: #fff; cursor: pointer; margin-top: 14px; margin-right: 8px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .muted { color: #666; font-size: 14px; }
  .ok { color: #0a7a2f; }
  .err { color: #b42318; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  .small { font-size: 13px; color: #555; }
  code { background:#f4f4f4; padding:2px 4px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>提出要部材購入 変換ツール</h1>
  <p class="muted">元の <code>.xlsx</code> を読み込み、Sheet2 の部材名・数量を Sheet1 に書き戻します。5日・15日・25日のみ対応。会社名と合計金額も更新します。</p>

  <div class="card">
    <label for="fileInput">元のExcelファイル（.xlsx）</label>
    <input type="file" id="fileInput" accept=".xlsx" />

    <label for="companyName">会社名（赤文字「ここに会社名」に入れる）</label>
    <input type="text" id="companyName" placeholder="例：株式会社○○" />

    <label for="orderDay">発注日（数量を書き込む列）</label>
    <select id="orderDay">
      <option value="5">5日（E列）</option>
      <option value="15">15日（F列）</option>
      <option value="25">25日（G列）</option>
    </select>

    <label for="matchMode">照合方法</label>
    <select id="matchMode">
      <option value="contains" selected>部分一致（おすすめ）</option>
      <option value="exact">完全一致</option>
    </select>

    <button id="previewBtn">読み込んで確認</button>
    <button id="exportBtn" disabled>Excelを書き出す</button>
    <div id="status" class="small"></div>
  </div>

  <div class="card">
    <strong>確認結果</strong>
    <div id="summary" class="small">まだ読み込んでいません。</div>
    <table id="previewTable" style="display:none;">
      <thead>
        <tr>
          <th>Sheet2の部材名</th>
          <th>数量</th>
          <th>一致したSheet1品目名</th>
          <th>書込先</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let preparedWorkbook = null;

function normalizeText(v) {
  return String(v ?? '')
    .replace(/[\u3000\s]+/g, '')
    .trim()
    .toLowerCase();
}

function getTargetColumn(orderDay) {
  if (orderDay === '5') return 'E';
  if (orderDay === '15') return 'F';
  return 'G';
}

function setCellValue(sheet, addr, value, type='s') {
  sheet[addr] = { t: type, v: value };
  const range = XLSX.utils.decode_range(sheet['!ref'] || 'A1:A1');
  const cell = XLSX.utils.decode_cell(addr);
  if (cell.r > range.e.r) range.e.r = cell.r;
  if (cell.c > range.e.c) range.e.c = cell.c;
  if (cell.r < range.s.r) range.s.r = cell.r;
  if (cell.c < range.s.c) range.s.c = cell.c;
  sheet['!ref'] = XLSX.utils.encode_range(range);
}

function getNumeric(v) {
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = Number(String(v).replace(/,/g, '').trim());
  return Number.isFinite(n) ? n : 0;
}

function parseSheetRows(sheet) {
  return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
}

function locateCompanyCell(sheet) {
  const rows = parseSheetRows(sheet);
  for (let r = 0; r < Math.min(rows.length, 8); r++) {
    for (let c = 0; c < Math.min((rows[r] || []).length, 8); c++) {
      const v = String(rows[r][c] ?? '');
      if (v.includes('ここに会社名')) {
        return XLSX.utils.encode_cell({r, c});
      }
    }
  }
  return 'C1';
}

function locateTotalCell(sheet) {
  const rows = parseSheetRows(sheet);
  for (let r = 0; r < Math.min(rows.length, 8); r++) {
    for (let c = 0; c < Math.min((rows[r] || []).length, 8); c++) {
      const v = String(rows[r][c] ?? '');
      if (v.includes('¥') || v.includes('￥')) {
        return XLSX.utils.encode_cell({r, c});
      }
    }
  }
  return 'B1';
}

function prepareWorkbook() {
  const file = document.getElementById('fileInput').files[0];
  const orderDay = document.getElementById('orderDay').value;
  const matchMode = document.getElementById('matchMode').value;
  const companyName = document.getElementById('companyName').value.trim();
  const status = document.getElementById('status');
  const summary = document.getElementById('summary');
  const tbody = document.querySelector('#previewTable tbody');
  const previewTable = document.getElementById('previewTable');
  const exportBtn = document.getElementById('exportBtn');

  if (!file) {
    alert('元のExcelファイルを選択してください。');
    return;
  }

  status.textContent = '読み込み中…';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellFormula: true, cellStyles: true });
      const sheet1 = workbook.Sheets['Sheet1'];
      const sheet2 = workbook.Sheets['Sheet2'];

      if (!sheet1 || !sheet2) {
        throw new Error('Sheet1 または Sheet2 が見つかりません。シート名を確認してください。');
      }

      const data1 = parseSheetRows(sheet1);
      const data2 = parseSheetRows(sheet2);
      const targetCol = getTargetColumn(orderDay);

      const partRows = [];
      for (let i = 1; i < data2.length; i++) {
        const partName = data2[i][1];
        const qty = data2[i][2];
        if (String(partName).trim() !== '' && qty !== '') {
          partRows.push({
            name: String(partName),
            nameNorm: normalizeText(partName),
            qty: getNumeric(qty)
          });
        }
      }

      const itemRows = [];
      for (let i = 1; i < data1.length; i++) {
        const itemName = data1[i][2];
        if (String(itemName).trim() !== '') {
          itemRows.push({
            rowNumber: i + 1,
            name: String(itemName),
            nameNorm: normalizeText(itemName)
          });
        }
      }

      for (let i = 2; i <= data1.length; i++) {
        setCellValue(sheet1, targetCol + i, 0, 'n');
      }

      let matched = 0;
      const previewRows = [];

      for (const part of partRows) {
        let hit = null;
        for (const item of itemRows) {
          const ok = matchMode === 'exact'
            ? item.nameNorm === part.nameNorm
            : item.nameNorm.includes(part.nameNorm) || part.nameNorm.includes(item.nameNorm);
          if (ok) {
            hit = item;
            break;
          }
        }

        if (hit) {
          const addr = targetCol + hit.rowNumber;
          setCellValue(sheet1, addr, part.qty, 'n');
          matched++;
          previewRows.push([part.name, part.qty, hit.name, addr]);
        }
      }

      for (let i = 2; i <= data1.length; i++) {
        sheet1['H' + i] = { t: 'n', f: `IFERROR(D${i}*SUM(E${i}:G${i}),0)` };
      }

      const totalCell = locateTotalCell(sheet1);
      sheet1[totalCell] = { t: 'n', f: 'SUM(H:H)' };

      const companyCell = locateCompanyCell(sheet1);
      if (companyName) {
        setCellValue(sheet1, companyCell, companyName, 's');
      }

      tbody.innerHTML = '';
      for (const row of previewRows.slice(0, 200)) {
        const tr = document.createElement('tr');
        row.forEach(v => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      previewTable.style.display = previewRows.length ? 'table' : 'none';
      summary.innerHTML = `一致件数: <strong>${matched}</strong> / Sheet2件数: <strong>${partRows.length}</strong><br>書込列: <strong>${targetCol}列</strong><br>会社名セル: <strong>${companyCell}</strong> / 合計セル: <strong>${totalCell}</strong>`;
      status.innerHTML = '<span class="ok">準備完了。</span>「Excelを書き出す」で保存してください。';
      preparedWorkbook = workbook;
      exportBtn.disabled = false;
    } catch (err) {
      status.innerHTML = `<span class="err">エラー: ${err.message}</span>`;
      summary.textContent = '読み込みに失敗しました。';
      previewTable.style.display = 'none';
      preparedWorkbook = null;
      exportBtn.disabled = true;
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportWorkbook() {
  if (!preparedWorkbook) {
    alert('先に「読み込んで確認」を押してください。');
    return;
  }
  const originalFile = document.getElementById('fileInput').files[0];
  const companyName = document.getElementById('companyName').value.trim();
  const orderDay = document.getElementById('orderDay').value;
  const base = originalFile ? originalFile.name.replace(/\.xlsx$/i, '') : '提出要部材購入';
  const suffix = `${orderDay}日${companyName ? '_' + companyName : ''}_更新`;
  XLSX.writeFile(preparedWorkbook, `${base}_${suffix}.xlsx`);
}

document.getElementById('previewBtn').addEventListener('click', prepareWorkbook);
document.getElementById('exportBtn').addEventListener('click', exportWorkbook);
</script>
</body>
</html>
