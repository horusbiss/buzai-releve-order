<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発注君</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  background:#f6f7fb;
  font-family:sans-serif;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:12px;
}

/* ===== タイトル（筆文字風） ===== */
.title{
  text-align:center;
  font-size:38px;
  font-weight:900;
  color:#000;
  margin-bottom:10px;

  /* 筆文字っぽく */
  letter-spacing:0.1em;

  text-shadow:
    1px 1px 0 #000,
    -1px -1px 0 #000,
    2px 2px 2px rgba(0,0,0,0.2);
}

/* ===== カード ===== */
.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

/* ===== 入力 ===== */
input,select{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:6px;
}

/* ===== ボタン ===== */
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

.primary{
  background:#2563eb;
  color:#fff;
}

.quick{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.quick button{
  background:#eee;
}

/* ===== 日付ボタン ===== */
.day{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.day input{
  display:none;
}

.day label{
  padding:12px;
  text-align:center;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  font-weight:bold;
}

.day input:checked + label{
  background:#000;
  color:#fff;
}

/* ===== 品目プレビュー ===== */
.preview{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  padding:10px;
  border:1px solid #eee;
  border-radius:10px;
}

.previewName{
  font-weight:bold;
}

.previewPrice{
  font-weight:bold;
}

/* ===== 一覧 ===== */
.table td{
  border-bottom:1px solid #eee;
  padding:6px;
}

.delete{
  background:red;
  color:#fff;
  padding:4px 6px;
  font-size:12px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="title">発注君</div>

<div class="card">
<input type="file" id="file">
<input id="name" placeholder="発注者">
<button class="primary" onclick="loadExcel()">Excel読込</button>
</div>

<div class="card">

<div class="day">
<input type="radio" name="day" id="d5" value="5" checked>
<label for="d5">5日</label>

<input type="radio" name="day" id="d15" value="15">
<label for="d15">15日</label>

<input type="radio" name="day" id="d25" value="25">
<label for="d25">25日</label>
</div>

<select id="group"></select>
<select id="item"></select>

<div class="preview">
<div class="previewName" id="pname">未選択</div>
<div class="previewPrice" id="pprice">¥0</div>
</div>

<input id="qty" type="number" value="0">

<div class="quick">
<button onclick="addQty(5)">5</button>
<button onclick="addQty(10)">10</button>
<button onclick="addQty(20)">20</button>
<button onclick="addQty(100)">100</button>
<button onclick="addQty(305)">305</button>
</div>

<button class="primary" onclick="add()">追加</button>

</div>

<div class="card">
<div>件数:<span id="count">0</span> 金額:<span id="total">0</span></div>
<table class="table" id="list"></table>
</div>

<button class="primary" onclick="share()">共有</button>

</div>

<script>
let wb,items=[],list=[]

function getDay(){
return document.querySelector('input[name="day"]:checked').value
}

function addQty(n){
qty.value=Number(qty.value)+n
}

function loadExcel(){

let f=file.files[0]
let r=new FileReader()

r.onload=e=>{

wb=XLSX.read(e.target.result,{type:"array"})

let s1=wb.Sheets["Sheet1"]
let s2=wb.Sheets["Sheet2"]

let d1=XLSX.utils.sheet_to_json(s1,{header:1})
let d2=XLSX.utils.sheet_to_json(s2,{header:1})

items=[]
let groups=new Set()

for(let i=1;i<d2.length;i++){
if(!d2[i][2])continue

items.push({
group:d2[i][0],
name:d2[i][3]||d2[i][2],
price:Number(d1[i+1][3]||0)
})

groups.add(d2[i][0])
}

group.innerHTML='<option value="">選択</option>'
groups.forEach(v=>group.innerHTML+=`<option>${v}</option>`)

alert("読込OK")
}

r.readAsArrayBuffer(f)
}

group.onchange=()=>{
item.innerHTML='<option value="">選択</option>'

items.filter(x=>x.group==group.value)
.forEach(x=>{
item.innerHTML+=`<option>${x.name}</option>`
})
}

item.onchange=()=>{
let it=items.find(x=>x.name==item.value)
pname.innerText=it?it.name:"未選択"
pprice.innerText=it?"¥"+it.price: "¥0"
}

function add(){

let name=item.value
let q=Number(qty.value)
let d=getDay()

if(!name||q<=0){
alert("入力不足")
return
}

let it=items.find(x=>x.name==name)

let ex=list.find(x=>x.name==name&&x.day==d)

if(ex)ex.qty+=q
else list.push({name,price:it.price,day:d,qty:q})

render()
}

function remove(i){
list.splice(i,1)
render()
}

function render(){

let html=""
let c=0,t=0

list.forEach((x,i)=>{
let m=x.price*x.qty
c+=x.qty
t+=m

html+=`<tr>
<td>${x.name}</td>
<td>${x.day}</td>
<td>${x.qty}</td>
<td>${m}</td>
<td><button class="delete" onclick="remove(${i})">削除</button></td>
</tr>`
})

listEl.innerHTML=html
count.innerText=c
total.innerText=t
}

function build(){

let ws=wb.Sheets["Sheet3"]

let data=[["品目","日付","数量"]]

list.forEach(x=>{
data.push([x.name,x.day,x.qty])
})

wb.Sheets["Sheet3"]=XLSX.utils.aoa_to_sheet(data)

return wb
}

async function share(){

if(!wb||list.length==0){
alert("データ不足")
return
}

let w=build()

let data=XLSX.write(w,{bookType:"xlsx",type:"array"})
let blob=new Blob([data])
let file=new File([blob],"発注.xlsx")

if(navigator.share){
await navigator.share({files:[file]})
}else{
XLSX.writeFile(w,"発注.xlsx")
}
}
</script>
</body>
</html>
