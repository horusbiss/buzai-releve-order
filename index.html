<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>部材発注サイト</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --line: #d9dee8;
      --text: #1f2937;
      --sub: #6b7280;
      --main: #1f4fd1;
      --main2: #173a9e;
      --danger: #c0392b;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Meiryo, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 24px;
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }
    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }
    .subtext {
      color: var(--sub);
      margin-bottom: 12px;
    }
    .grid {
      display: grid;
      gap: 12px;
    }
    .grid-4 { grid-template-columns: 1.1fr 1fr 150px 120px; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    label {
      display: block;
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select, textarea, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
    }
    textarea { resize: vertical; min-height: 96px; }
    button {
      cursor: pointer;
      border: none;
      color: white;
      background: var(--main);
      font-weight: 700;
    }
    button:hover { background: var(--main2); }
    .secondary { background: #4b5563; }
    .secondary:hover { background: #374151; }
    .danger { background: var(--danger); }
    .danger:hover { background: #962d22; }
    .success { background: var(--ok); }
    .success:hover { background: #14532d; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .actions button { width: auto; min-width: 180px; }
    .hint {
      font-size: 13px;
      color: var(--sub);
      margin-top: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f5;
      vertical-align: top;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #f8fafc;
      position: sticky;
      top: 0;
    }
    .table-wrap {
      max-height: 400px;
      overflow: auto;
      border: 1px solid #edf0f5;
      border-radius: 12px;
      margin-top: 10px;
    }
    .empty {
      color: var(--sub);
      padding: 16px 4px 4px;
    }
    .pill {
      display: inline-block;
      background: #eef4ff;
      color: #1e40af;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .preview {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      min-height: 170px;
    }
    .stat {
      font-size: 14px;
      color: var(--sub);
      margin-top: 6px;
    }
    @media (max-width: 900px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .actions button { width: 100%; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>部材発注サイト</h1>
      <div class="subtext">実部材マスタ反映済み / 数量1〜300 / メールテンプレ化 / Excel互換CSV出力</div>
      <div class="grid grid-3">
        <div>
          <label for="orderDate">発注日</label>
          <input type="date" id="orderDate" />
        </div>
        <div>
          <label for="requester">発注者</label>
          <input type="text" id="requester" placeholder="例：田中 太郎" />
        </div>
        <div>
          <label for="remarks">備考</label>
          <input type="text" id="remarks" placeholder="例：至急、午前配送希望" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="pill">部材追加</div>
      <div class="grid grid-4">
        <div>
          <label for="category">大項目</label>
          <select id="category"></select>
        </div>
        <div>
          <label for="material">部材名</label>
          <select id="material"></select>
        </div>
        <div>
          <label for="qty">数量</label>
          <select id="qty"></select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button onclick="addItem()">追加</button>
        </div>
      </div>
      <div class="hint">大項目を選ぶと、その中の部材だけ表示されます。</div>
    </div>

    <div class="card">
      <div class="pill">発注一覧</div>
      <div class="stat"><span id="itemCount">0</span>件 / 合計数量 <span id="totalQty">0</span></div>
      <div id="emptyMessage" class="empty">まだ部材が追加されていません。</div>
      <div class="table-wrap" id="tableWrap" style="display:none;">
        <table>
          <thead>
            <tr>
              <th style="width: 17%;">大項目</th>
              <th>部材名</th>
              <th style="width: 10%;">数量</th>
              <th style="width: 10%;">削除</th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <button class="secondary" onclick="downloadCSV()">Excel共有(.xlsx)</button>
        <button class="secondary" onclick="copyEmailText()">メール本文コピー</button>
        <button class="success" onclick="openMailTemplate()">送信ボタン（メール起動）</button>
        <button class="danger" onclick="clearItems()">全削除</button>
      </div>
      <div class="hint">スマホではExcelファイル(.xlsx)を共有できます。メール起動は、お使いのメールアプリが設定されている場合に使えます。</div>
    </div>

    <div class="card">
      <div class="pill">メールテンプレ preview</div>
      <label for="mailSubject">件名</label>
      <input id="mailSubject" readonly />
      <label for="mailBody" style="margin-top:10px;">本文</label>
      <div class="preview" id="mailBody"></div>
    </div>
  </div>

    const categorySelect = document.getElementById('category');
    const materialSelect = document.getElementById('material');
    const qtySelect = document.getElementById('qty');
    const orderBody = document.getElementById('orderBody');
    const emptyMessage = document.getElementById('emptyMessage');
    const tableWrap = document.getElementById('tableWrap');
    const mailSubjectInput = document.getElementById('mailSubject');
    const mailBodyPreview = document.getElementById('mailBody');
    const itemCount = document.getElementById('itemCount');
    const totalQty = document.getElementById('totalQty');

    const orderDate = document.getElementById('orderDate');
    const requester = document.getElementById('requester');
    const remarks = document.getElementById('remarks');

    let orders = [];

    function setToday() {
      const now = new Date();
      const jstOffset = 9 * 60;
      const local = new Date(now.getTime() + (jstOffset - now.getTimezoneOffset()) * 60000);
      orderDate.value = local.toISOString().slice(0, 10);
    }

    function buildCategoryOptions() {
      categorySelect.innerHTML = '';
      Object.keys(materials).forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function buildMaterialOptions() {
      const cat = categorySelect.value;
      materialSelect.innerHTML = '';
      (materials[cat] || []).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        materialSelect.appendChild(option);
      });
    }

    function buildQtyOptions() {
      qtySelect.innerHTML = '';
      for (let i = 1; i <= 100; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = i;
        qtySelect.appendChild(option);
      }
    }

    function addItem() {
      const category = categorySelect.value;
      const material = materialSelect.value;
      const qty = Number(qtySelect.value);
      if (!category || !material || !qty) return;

      orders.push({ category, material, qty });
      renderTable();
    }

    function deleteItem(index) {
      orders.splice(index, 1);
      renderTable();
    }

    function clearItems() {
      orders = [];
      renderTable();
    }

    function makeSubject() {
      const date = orderDate.value || '';
      const name = requester.value.trim() || '未入力';
      return `部材発注_${date}_${name}`;
    }

    function makeBody() {
      const date = orderDate.value || '';
      const name = requester.value.trim() || '';
      const note = remarks.value.trim() || '';
      const lines = [];
      lines.push('お疲れさまです。');
      lines.push('');
      lines.push('下記、部材発注をお願いします。');
      lines.push('');
      lines.push(`【発注日】${date}`);
      lines.push(`【発注者】${name}`);
      lines.push(`【備考】${note}`);
      lines.push('');
      lines.push('【発注内容】');

      if (orders.length === 0) {
        lines.push('※発注内容が未入力です');
      } else {
        orders.forEach((item, i) => {
          lines.push(`${i + 1}. [${item.category}] ${item.material} × ${item.qty}`);
        });
      }

      lines.push('');
      lines.push('以上、よろしくお願いいたします。');
      return lines.join('\n');
    }

    function renderMailPreview() {
      mailSubjectInput.value = makeSubject();
      mailBodyPreview.textContent = makeBody();
    }

    function renderTable() {
      orderBody.innerHTML = '';
      itemCount.textContent = String(orders.length);
      totalQty.textContent = String(orders.reduce((sum, item) => sum + Number(item.qty || 0), 0));

      if (orders.length === 0) {
        emptyMessage.style.display = 'block';
        tableWrap.style.display = 'none';
      } else {
        emptyMessage.style.display = 'none';
        tableWrap.style.display = 'block';

        orders.forEach((item, index) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.category}</td>
            <td>${item.material}</td>
            <td>${item.qty}</td>
            <td><button class="danger" style="padding:8px 10px;" onclick="deleteItem(${index})">削除</button></td>
          `;
          orderBody.appendChild(row);
        });
      }
      renderMailPreview();
    }

    
    function fileSafe(value) {
      return String(value || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    }

    function buildExcelRows() {
      const orderDateEl = document.getElementById('orderDate');
      const requesterEl = document.getElementById('requester');
      const remarksEl = document.getElementById('remarks');

      const orderDate = orderDateEl ? orderDateEl.value : '';
      const requester = requesterEl ? requesterEl.value : '';
      const remarks = remarksEl ? remarksEl.value : '';

      const rows = [
        ['発注日', orderDate],
        ['発注者', requester],
        ['備考', remarks],
        [],
        ['大項目', '部材名', '数量']
      ];

      orders.forEach(item => {
        rows.push([item.category || '', item.material || '', item.qty || '']);
      });

      return rows;
    }

    async function downloadCSV() {
      if (orders.length === 0) {
        alert('発注一覧が空です。');
        return;
      }

      const rows = buildExcelRows();
      const worksheet = XLSX.utils.aoa_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '発注書');

      const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob(
        [wbout],
        { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }
      );

      const orderDateEl = document.getElementById('orderDate');
      const requesterEl = document.getElementById('requester');
      const orderDate = orderDateEl ? orderDateEl.value : '';
      const requester = requesterEl ? requesterEl.value : '';

      const filename = `部材発注_${fileSafe(orderDate || '日付未入力')}_${fileSafe(requester || '発注者未入力')}.xlsx`;
      const file = new File([blob], filename, { type: blob.type });

      try {
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: '部材発注書',
            text: 'Excelファイルを共有します。',
            files: [file]
          });
          return;
        }
      } catch (err) {
        console.log('share canceled or failed', err);
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function openMailTemplate() {
      const subject = encodeURIComponent(makeSubject());
      const body = encodeURIComponent(makeBody());
      window.location.href = `mailto:${FIXED_TO}?subject=${subject}&body=${body}`;
    }

    categorySelect.addEventListener('change', buildMaterialOptions);
    orderDate.addEventListener('input', renderMailPreview);
    requester.addEventListener('input', renderMailPreview);
    remarks.addEventListener('input', renderMailPreview);

    setToday();
    buildCategoryOptions();
    buildMaterialOptions();
    buildQtyOptions();
    renderTable();
  </script>
</body>
</html>
