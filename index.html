
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>部材拾い出し＋Excel変換 一体版 v8.1 fix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--danger:#b91c1c;--info:#1d4ed8;--soft:#eef2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 110px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 1px rgba(0,0,0,.02)}
label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}
input[type="text"],input[type="file"],select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
button{border:none;border-radius:14px;background:var(--accent);color:#fff;padding:14px 16px;cursor:pointer;font-weight:800;font-size:16px;min-height:48px}
button.secondary{background:#374151}
button.ghost{background:#fff;color:#111;border:1px solid var(--line)}
button:disabled{opacity:.55;cursor:not-allowed}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.status{font-size:13px;margin-top:10px;line-height:1.5}
.ok{color:var(--ok)} .danger{color:var(--danger)} .info{color:var(--info)}
.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summaryBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:10px}
.mini .k{font-size:12px;color:var(--muted)} .mini .v{font-size:18px;font-weight:900;margin-top:3px}
.notice{margin-top:10px;padding:10px 12px;border:1px solid #c7d2fe;background:var(--soft);border-radius:14px;font-size:13px;line-height:1.5}
.hide{display:none}
.rowCard{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;background:#fff}
.rowHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:15px;font-weight:800;line-height:1.4}
.meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.price{font-size:13px;font-weight:800;white-space:nowrap}
.qtyGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.qtyBox{background:#f9fafb;border:1px solid var(--line);border-radius:14px;padding:8px}
.qtyBox .k{font-size:11px;color:var(--muted);margin-bottom:6px}
.qtyBox input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:right;font-size:18px;background:#fff}
.totalRow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.delBtn{width:100%;margin-top:10px}
.flash{background:#ecfeff}
.stickyBar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(245,247,251,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.stickyInner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stickyInner2{max-width:760px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.quickBtns button{padding:10px 0;min-height:42px;font-size:15px}
.linkBox{margin-top:10px;padding:10px 12px;background:#f9fafb;border:1px solid var(--line);border-radius:14px;word-break:break-all}
@media (min-width:761px){.wrap{padding-bottom:24px}.stickyBar{position:static;padding:0;background:transparent;border-top:none;backdrop-filter:none}.stickyInner,.stickyInner2{max-width:none;display:flex;gap:10px;margin-top:12px}.stickyInner button,.stickyInner2 button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <h1>部材拾い出し＋Excel変換</h1>
  <div class="sub">読み込み不具合を修正した版です。</div>

  <div class="card">
    <div class="pill">手順 1</div>
    <label for="xlsxFile">元のExcelファイル（.xlsx）</label>
    <input type="file" id="xlsxFile" accept=".xlsx,.xlsm" />
    <label for="companyName">会社名</label>
    <input type="text" id="companyName" placeholder="例：株式会社○○" />
    <div class="two" style="margin-top:10px">
      <button id="loadBtn">Excelを読み込む</button>
      <button id="clearBtn" class="ghost">数量を全部クリア</button>
    </div>
    <div id="loadStatus" class="status"></div>
    <div class="summaryBox">
      <div class="mini"><div class="k">読込件数</div><div class="v" id="sumItems">0</div></div>
      <div class="mini"><div class="k">拾い出し件数</div><div class="v" id="sumSelected">0</div></div>
      <div class="mini"><div class="k">概算合計</div><div class="v" id="sumTotal">¥0</div></div>
      <div class="mini"><div class="k">会社名</div><div class="v" id="sumCompany">-</div></div>
    </div>
    <div id="saveStatus" class="status"></div>
    <div id="manualLinkBox" class="linkBox hide"></div>
  </div>

  <div class="card">
    <div class="pill">手順 2</div>
    <label for="dayPicker">日付</label>
    <select id="dayPicker">
      <option value="5">5日</option>
      <option value="15">15日</option>
      <option value="25">25日</option>
    </select>
    <label for="groupPicker">品目グループ名</label>
    <select id="groupPicker"><option value="">先にExcelを読み込んでください</option></select>
    <label for="itemPicker">品目名</label>
    <select id="itemPicker"><option value="">先にグループを選んでください</option></select>
    <label for="qtyOne">数量</label>
    <input type="text" id="qtyOne" inputmode="numeric" placeholder="0">
    <div class="quickBtns">
      <button type="button" class="ghost quickAdd" data-add="1">+1</button>
      <button type="button" class="ghost quickAdd" data-add="5">+5</button>
      <button type="button" class="ghost quickAdd" data-add="10">+10</button>
      <button type="button" class="ghost" id="qtyClearBtn">クリア</button>
    </div>
    <div id="mergeNotice" class="notice hide"></div>
  </div>

  <div class="card">
    <div class="pill">拾い出し結果</div>
    <div id="pickedList"></div>
  </div>
</div>

<div class="stickyBar">
  <div class="stickyInner">
    <button id="addBtn">拾い出しに追加</button>
    <button id="downloadExcelBtn" class="secondary" disabled>保存</button>
  </div>
  <div class="stickyInner2">
    <button id="shareExcelBtn" class="ghost" disabled>ファイル共有</button>
    <button id="mailBtn" class="ghost" disabled>メール起動</button>
  </div>
</div>

<script>
const FIXED_EMAIL = 'horus2018since@gmail.com';
let originalWorkbook = null;
let sheet1Name = 'Sheet1';
let sheet2Name = 'Sheet2';
let allItems = [];
let pickedItems = [];
let lastFlashRow = null;
let currentDownloadUrl = null;

function yen(n){ return '¥' + Number(n || 0).toLocaleString('ja-JP'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseRows(sheet){ return XLSX.utils.sheet_to_json(sheet, {header:1, defval:''}); }
function setCellPreserve(sheet, addr, value, type){
  const cell = sheet[addr] || {};
  sheet[addr] = Object.assign({}, cell, { t: type, v: value });
  const range = XLSX.utils.decode_range(sheet['!ref'] || 'A1:A1');
  const decoded = XLSX.utils.decode_cell(addr);
  if (decoded.r > range.e.r) range.e.r = decoded.r;
  if (decoded.c > range.e.c) range.e.c = decoded.c;
  if (decoded.r < range.s.r) range.s.r = decoded.r;
  if (decoded.c < range.s.c) range.s.c = decoded.c;
  sheet['!ref'] = XLSX.utils.encode_range(range);
}
function clearCellValuePreserveStyle(sheet, addr){
  const cell = sheet[addr] || {};
  sheet[addr] = Object.assign({}, cell, { t: 's', v: '' });
}
function findSheetNames(workbook){
  const names = workbook.SheetNames;
  const s1 = names.find(n => /^sheet1$/i.test(n)) || names[0];
  const s2 = names.find(n => /^sheet2$/i.test(n)) || names[1] || names[0];
  return { s1, s2 };
}
function findCompanyCell(sheet){
  const rows = parseRows(sheet);
  for (let r = 0; r < Math.min(rows.length, 8); r++) {
    for (let c = 0; c < Math.min((rows[r] || []).length, 8); c++) {
      const v = String(rows[r][c] ?? '');
      if (v.includes('ここに会社名')) return XLSX.utils.encode_cell({ r, c });
    }
  }
  return 'C1';
}
function buildItemsFromSheet1(sheet){
  const rows = parseRows(sheet);
  const out = [];
  let displayNo = 1;
  for (let i = 1; i < rows.length; i++) {
    const group = rows[i][0];
    const code = rows[i][1];
    const name = rows[i][2];
    const price = rows[i][3];
    if (String(name).trim() === '') continue;
    out.push({
      rowNumber: i + 1,
      group: String(group ?? ''),
      code: String(code ?? ''),
      rawName: String(name ?? ''),
      displayName: displayNo + '. ' + String(name ?? ''),
      price: Number(price) || 0
    });
    displayNo++;
  }
  return out;
}
function refreshSummary(){
  const total = pickedItems.reduce((s, x) => s + x.price * ((x.d5 || 0) + (x.d15 || 0) + (x.d25 || 0)), 0);
  document.getElementById('sumItems').textContent = allItems.length;
  document.getElementById('sumSelected').textContent = pickedItems.length;
  document.getElementById('sumTotal').textContent = yen(total);
  document.getElementById('sumCompany').textContent = document.getElementById('companyName').value.trim() || '-';
  const enabled = !!originalWorkbook && pickedItems.length > 0;
  document.getElementById('downloadExcelBtn').disabled = !enabled;
  document.getElementById('shareExcelBtn').disabled = !enabled;
  document.getElementById('mailBtn').disabled = !enabled;
}
function renderGroupPicker(){
  const groups = [...new Set(allItems.map(x => x.group).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
  const sel = document.getElementById('groupPicker');
  sel.innerHTML = '<option value="">選んでください</option>' + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  document.getElementById('itemPicker').innerHTML = '<option value="">先にグループを選んでください</option>';
}
function renderItemPicker(){
  const group = document.getElementById('groupPicker').value;
  const list = allItems.filter(x => x.group === group);
  const sel = document.getElementById('itemPicker');
  sel.innerHTML = '<option value="">選んでください</option>' + list.map(x => `<option value="${x.rowNumber}">${esc(x.displayName)}</option>`).join('');
}
function showMergeNotice(html){
  const box = document.getElementById('mergeNotice');
  box.innerHTML = html;
  box.classList.remove('hide');
}
function hideMergeNotice(){ document.getElementById('mergeNotice').classList.add('hide'); }
function renderPickedList(){
  const root = document.getElementById('pickedList');
  if (!pickedItems.length) {
    root.innerHTML = '<div class="small" style="padding:10px 0">まだ追加されていません。</div>';
    return;
  }
  root.innerHTML = pickedItems.map((x, idx) => `
    <div class="rowCard ${lastFlashRow === idx ? 'flash' : ''}" id="picked-row-${idx}">
      <div class="rowHead">
        <div>
          <div class="name">${esc(x.displayName)}</div>
          <div class="meta">${esc(x.group)} / ${esc(x.code)}</div>
        </div>
        <div class="price">${yen(x.price)}</div>
      </div>
      <div class="qtyGrid">
        <div class="qtyBox"><div class="k">5日</div><input class="qtyEdit" data-idx="${idx}" data-day="5" value="${x.d5 || ''}" inputmode="numeric"></div>
        <div class="qtyBox"><div class="k">15日</div><input class="qtyEdit" data-idx="${idx}" data-day="15" value="${x.d15 || ''}" inputmode="numeric"></div>
        <div class="qtyBox"><div class="k">25日</div><input class="qtyEdit" data-idx="${idx}" data-day="25" value="${x.d25 || ''}" inputmode="numeric"></div>
      </div>
      <div class="totalRow"><strong>行合計</strong><strong>${yen(x.price * ((x.d5 || 0) + (x.d15 || 0) + (x.d25 || 0)))}</strong></div>
      <button class="ghost delBtn" data-idx="${idx}">この行を削除</button>
    </div>
  `).join('');
  root.querySelectorAll('.qtyEdit').forEach(el => {
    el.addEventListener('input', e => {
      const idx = Number(e.target.dataset.idx);
      const day = e.target.dataset.day;
      const n = Math.max(0, parseInt(e.target.value || '0', 10) || 0);
      if (day === '5') pickedItems[idx].d5 = n;
      if (day === '15') pickedItems[idx].d15 = n;
      if (day === '25') pickedItems[idx].d25 = n;
      lastFlashRow = idx;
      renderPickedList();
      refreshSummary();
      clearPreparedFile();
      setTimeout(() => { lastFlashRow = null; renderPickedList(); }, 350);
    });
  });
  root.querySelectorAll('.delBtn').forEach(el => {
    el.addEventListener('click', e => {
      const idx = Number(e.target.dataset.idx);
      pickedItems.splice(idx, 1);
      lastFlashRow = null;
      renderPickedList();
      refreshSummary();
      clearPreparedFile();
    });
  });
}
function clearPreparedFile(){
  document.getElementById('saveStatus').textContent = '';
  const box = document.getElementById('manualLinkBox');
  box.classList.add('hide');
  box.innerHTML = '';
  if (currentDownloadUrl) {
    URL.revokeObjectURL(currentDownloadUrl);
    currentDownloadUrl = null;
  }
}
function loadWorkbook(){
  const file = document.getElementById('xlsxFile').files[0];
  const status = document.getElementById('loadStatus');
  if (!file) {
    status.innerHTML = '<span class="danger">元のExcelファイルを選択してください。</span>';
    return;
  }
  status.textContent = '読み込み中…';
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      originalWorkbook = XLSX.read(data, { type: 'array', cellFormula: true, cellStyles: true });
      const names = findSheetNames(originalWorkbook);
      sheet1Name = names.s1;
      sheet2Name = names.s2;
      allItems = buildItemsFromSheet1(originalWorkbook.Sheets[sheet1Name]);
      pickedItems = [];
      lastFlashRow = null;
      renderGroupPicker();
      renderPickedList();
      refreshSummary();
      hideMergeNotice();
      clearPreparedFile();
      status.innerHTML = `<span class="ok">読込完了。</span> ${sheet1Name} から ${allItems.length} 件読み込みました。`;
    } catch (err) {
      status.innerHTML = `<span class="danger">エラー: ${esc(err.message || String(err))}</span>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function addPickedItem(){
  const itemValue = document.getElementById('itemPicker').value;
  const day = document.getElementById('dayPicker').value;
  const qty = Math.max(0, parseInt(document.getElementById('qtyOne').value || '0', 10) || 0);
  if (!itemValue) { alert('品目名を選んでください。'); return; }
  if (qty === 0) { alert('数量を入れてください。'); return; }
  const rowNumber = Number(itemValue);
  const base = allItems.find(x => x.rowNumber === rowNumber);
  if (!base) { alert('品目が見つかりません。'); return; }
  const existsIndex = pickedItems.findIndex(x => x.rowNumber === base.rowNumber);
  if (existsIndex >= 0) {
    if (day === '5') pickedItems[existsIndex].d5 += qty;
    if (day === '15') pickedItems[existsIndex].d15 += qty;
    if (day === '25') pickedItems[existsIndex].d25 += qty;
    lastFlashRow = existsIndex;
    showMergeNotice(`<span class="info">同じ品目があるので既存行に加算しました。</span><br>${esc(base.displayName)}<br>${day}日へ ${qty} 追加`);
  } else {
    pickedItems.push({
      rowNumber: base.rowNumber,
      group: base.group,
      code: base.code,
      rawName: base.rawName,
      displayName: base.displayName,
      price: base.price,
      d5: day === '5' ? qty : 0,
      d15: day === '15' ? qty : 0,
      d25: day === '25' ? qty : 0
    });
    lastFlashRow = pickedItems.length - 1;
    showMergeNotice(`<span class="info">追加しました。</span><br>${esc(base.displayName)}<br>${day}日へ ${qty} 入力`);
  }
  document.getElementById('qtyOne').value = '';
  renderPickedList();
  refreshSummary();
  clearPreparedFile();
  const card = document.getElementById('picked-row-' + lastFlashRow);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => { lastFlashRow = null; renderPickedList(); }, 700);
}
function clearAllQty(){
  pickedItems = [];
  lastFlashRow = null;
  renderPickedList();
  refreshSummary();
  hideMergeNotice();
  clearPreparedFile();
}
function buildWorkbook(){
  const wb = XLSX.read(XLSX.write(originalWorkbook, { type: 'array', bookType: 'xlsx', cellStyles: true }), { type: 'array', cellFormula: true, cellStyles: true });
  const sheet1 = wb.Sheets[sheet1Name];
  const sheet2 = wb.Sheets[sheet2Name];
  pickedItems.forEach(item => {
    setCellPreserve(sheet1, 'E' + item.rowNumber, item.d5 || 0, 'n');
    setCellPreserve(sheet1, 'F' + item.rowNumber, item.d15 || 0, 'n');
    setCellPreserve(sheet1, 'G' + item.rowNumber, item.d25 || 0, 'n');
  });
  const companyCell = findCompanyCell(sheet1);
  const companyName = document.getElementById('companyName').value.trim();
  if (companyName) setCellPreserve(sheet1, companyCell, companyName, 's');
  const maxRows = Math.max(pickedItems.length + 5, 300);
  for (let r = 2; r <= maxRows; r++) {
    clearCellValuePreserveStyle(sheet2, 'A' + r);
    clearCellValuePreserveStyle(sheet2, 'B' + r);
    clearCellValuePreserveStyle(sheet2, 'C' + r);
  }
  pickedItems.forEach((x, idx) => {
    const r = idx + 2;
    const totalQty = (x.d5 || 0) + (x.d15 || 0) + (x.d25 || 0);
    setCellPreserve(sheet2, 'A' + r, x.group, 's');
    setCellPreserve(sheet2, 'B' + r, x.rawName, 's');
    setCellPreserve(sheet2, 'C' + r, totalQty, 'n');
  });
  if (!wb.Workbook) wb.Workbook = {};
  if (!wb.Workbook.CalcPr) wb.Workbook.CalcPr = {};
  wb.Workbook.CalcPr.fullCalcOnLoad = "1";
  wb.Workbook.CalcPr.forceFullCalc = "1";
  return wb;
}
function buildOrderBody(){
  const lines = ['お世話になっております。', '', '以下の部材を発注いたします。', ''];
  pickedItems.forEach((x, idx) => {
    const parts = [];
    if (x.d5) parts.push('5日:' + x.d5);
    if (x.d15) parts.push('15日:' + x.d15);
    if (x.d25) parts.push('25日:' + x.d25);
    lines.push((idx + 1) + '. ' + x.rawName + '（' + parts.join(' / ') + '）');
  });
  lines.push('', '添付ファイルをご確認ください。', '', document.getElementById('companyName').value.trim() || '');
  return lines.join('\n');
}
function prepareFile(){
  if (!originalWorkbook) throw new Error('先にExcelを読み込んでください。');
  if (!pickedItems.length) throw new Error('拾い出し結果がありません。');
  const wb = buildWorkbook();
  const companyName = document.getElementById('companyName').value.trim();
  const baseName = (document.getElementById('xlsxFile').files[0]?.name || '提出要部材購入').replace(/\.xlsx$/i, '');
  const filename = `${baseName}_${companyName || '会社名なし'}_更新.xlsx`;
  const array = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellStyles: true });
  const blob = new Blob([array], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  return { blob, filename };
}
function showManualLink(blob, filename){
  if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
  currentDownloadUrl = URL.createObjectURL(blob);
  const box = document.getElementById('manualLinkBox');
  box.innerHTML = `保存や共有が始まらない場合は、<a href="${currentDownloadUrl}" download="${filename}">ここをタップ</a>`;
  box.classList.remove('hide');
}
function downloadFile(){
  try {
    const { blob, filename } = prepareFile();
    showManualLink(blob, filename);
    const a = document.createElement('a');
    a.href = currentDownloadUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 100);
    document.getElementById('saveStatus').innerHTML = '<span class="ok">保存用ファイルを作成しました。</span>';
  } catch (err) {
    document.getElementById('saveStatus').innerHTML = `<span class="danger">保存エラー: ${esc(err.message || String(err))}</span>`;
  }
}
async function shareFile(){
  try {
    const { blob, filename } = prepareFile();
    showManualLink(blob, filename);
    const file = new File([blob], filename, { type: blob.type, lastModified: Date.now() });
    const body = buildOrderBody();
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '部材発注', text: '宛先: ' + FIXED_EMAIL + '\n\n' + body });
      document.getElementById('saveStatus').innerHTML = '<span class="ok">共有シートを開きました。</span>';
      return;
    }
    downloadFile();
    document.getElementById('saveStatus').innerHTML = '<span class="info">この端末では直接共有に未対応のため、保存リンクを出しました。</span>';
  } catch (err) {
    if (String(err && err.name) === 'AbortError') {
      document.getElementById('saveStatus').innerHTML = '<span class="info">共有をキャンセルしました。</span>';
    } else {
      document.getElementById('saveStatus').innerHTML = `<span class="danger">共有エラー: ${esc(err.message || String(err))}</span>`;
    }
  }
}
async function launchMail(){
  try {
    const body = buildOrderBody();
    const subject = '部材発注の件';
    try {
      const { blob, filename } = prepareFile();
      showManualLink(blob, filename);
      const file = new File([blob], filename, { type: blob.type, lastModified: Date.now() });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: subject, text: '宛先: ' + FIXED_EMAIL + '\n\n' + body });
        document.getElementById('saveStatus').innerHTML = '<span class="ok">共有シートを開きました。Mail や Gmail を選んで送信してください。</span>';
        return;
      }
    } catch (_e) {}
    window.location.href = 'mailto:' + encodeURIComponent(FIXED_EMAIL) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body + '\n\n※ 添付ファイルは保存リンクから取得してください。');
    const { blob, filename } = prepareFile();
    showManualLink(blob, filename);
    document.getElementById('saveStatus').innerHTML = '<span class="info">メールアプリを起動しました。添付が自動で入らない場合は、下の保存リンクからファイルを添付してください。</span>';
  } catch (err) {
    document.getElementById('saveStatus').innerHTML = `<span class="danger">メール起動エラー: ${esc(err.message || String(err))}</span>`;
  }
}
document.getElementById('loadBtn').addEventListener('click', loadWorkbook);
document.getElementById('clearBtn').addEventListener('click', clearAllQty);
document.getElementById('groupPicker').addEventListener('change', renderItemPicker);
document.getElementById('addBtn').addEventListener('click', addPickedItem);
document.getElementById('downloadExcelBtn').addEventListener('click', downloadFile);
document.getElementById('shareExcelBtn').addEventListener('click', shareFile);
document.getElementById('mailBtn').addEventListener('click', launchMail);
document.getElementById('companyName').addEventListener('input', () => { refreshSummary(); clearPreparedFile(); });
document.getElementById('qtyClearBtn').addEventListener('click', () => { document.getElementById('qtyOne').value = ''; });
document.querySelectorAll('.quickAdd').forEach(btn => {
  btn.addEventListener('click', () => {
    const el = document.getElementById('qtyOne');
    const cur = Math.max(0, parseInt(el.value || '0', 10) || 0);
    el.value = cur + Number(btn.dataset.add);
  });
});
</script>
