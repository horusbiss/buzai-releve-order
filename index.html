<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部材拾い出し＋Excel変換</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:0;
  color:#111827;
}
.wrap{
  max-width:820px;
  margin:0 auto;
  padding:16px 16px 150px;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
label{
  font-weight:700;
  margin-top:10px;
  display:block;
}
input,select,button,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
  box-sizing:border-box;
}
button{
  background:#111827;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button.secondary{ background:#374151; }
button.ghost{
  background:#fff;
  color:#111;
  border:1px solid #e5e7eb;
}
.deleteBtn{
  background:#ef4444;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px;
  margin-top:10px;
  font-weight:700;
  cursor:pointer;
  width:100%;
}
.quickBtns{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:8px;
}
.item{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}
.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  border-top:1px solid #e5e7eb;
  padding:8px 12px;
}
.footerRow{
  max-width:820px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.summary{
  max-width:820px;
  margin:8px auto 0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
}
.review{
  margin-top:12px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
}
.review table{
  width:100%;
  border-collapse:collapse;
}
.review th,.review td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
  text-align:left;
}
.review .num{ text-align:right; }
</style>
</head>

<body>
<div class="wrap">

  <!-- Excel読み込み -->
  <div class="card">
    <h2>部材拾い出し＋Excel変換</h2>
    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">

    <label>会社名</label>
    <input type="text" id="companyName" placeholder="例：株式会社○○">

    <button onclick="loadExcel()">Excelを読み込む</button>
    <div id="loadStatus" class="small"></div>
  </div>

  <!-- 入力 -->
  <div class="card">
    <label>日付</label>
    <select id="dayPicker">
      <option value="5">5日</option>
      <option value="15">15日</option>
      <option value="25">25日</option>
    </select>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <div class="quickBtns">
      <button type="button" class="ghost quickAdd" data-add="5">+5</button>
      <button type="button" class="ghost quickAdd" data-add="10">+10</button>
      <button type="button" class="ghost quickAdd" data-add="100">+100</button>
      <button type="button" class="ghost quickAdd" data-add="200">+200</button>
      <button type="button" class="ghost quickAdd" data-add="305">+305</button>
    </div>

    <button id="addBtn">カートに入れる</button>
  </div>

  <!-- カート -->
  <div class="card">
    <h3>カート</h3>
    <div id="cartList"></div>
  </div>

  <!-- 確認一覧 -->
  <div class="card review">
    <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
      <span>合計件数: <span id="reviewCount">0</span></span>
      <span>合計金額: <span id="reviewTotal">¥0</span></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>品目名</th>
          <th>日付</th>
          <th class="num">数量</th>
          <th class="num">金額</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>

    <label style="margin-top:12px">メール本文</label>
    <textarea id="mailBody" rows="8"></textarea>
  </div>
</div>

<!-- フッター -->
<div class="footer">
  <div class="footerRow">
    <button id="saveBtn" class="secondary">保存</button>
    <button id="shareBtn" class="ghost">ファイル共有</button>
  </div>
  <div class="footerRow" style="margin-top:8px">
    <button id="mailBtn" class="ghost">メール起動</button>
    <div></div>
  </div>
  <div class="summary">
    <span>合計金額</span>
    <span id="sumTotal">¥0</span>
  </div>
</div>

<script>
const FIXED_EMAIL = 'horus2018since@gmail.com';

/* 長い名前 → 短い名前の対応表 */
const RAW_NAME_MAP = {
  "1G ﾌｨﾙﾀｰｽｲｯﾁ付き保安器/NH-K1FATT(lot:20)": "ﾌｨﾙﾀｰｽｲｯﾁ付き保安器",
  "1G 双方向1分岐型保安器/UJH7ACF(lot:50)": "1分岐型保安器",
  "1G 双方向2分配型保安器/UJH7ADF(lot:50)": "2分配型保安器",
  "1G 双方向保安器/UJH7AF(lot:50)": "双方向保安器",
  "CATV保安器盤(lot:1000)": "CATV保安器盤"
};

/* 文字列正規化 */
function normalizeName(str){
  return String(str)
    .trim()
    .replace(/\s+/g,'')
    .replace(/（/g,'(')
    .replace(/）/g,')')
    .replace(/／/g,'/')
    .replace(/[‐-–—−]/g,'-')
    .toLowerCase();
}

/* 正規化したマッピング */
const NAME_MAP = {};
Object.keys(RAW_NAME_MAP).forEach(key=>{
  NAME_MAP[normalizeName(key)] = RAW_NAME_MAP[key];
});

/* 短い名前取得 */
function shortName(longName){
  const normalized = normalizeName(longName);
  return NAME_MAP[normalized] || longName;
}

let workbook = null;
let items = [];
let cart = [];

function yen(n){
  return '¥' + Number(n || 0).toLocaleString('ja-JP');
}

function loadExcel(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){
    alert('Excelを選択してください');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    workbook = XLSX.read(e.target.result, {type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(sheet, {header:1});

    items = [];
    const groups = new Set();

    data.forEach((row, i)=>{
      if(row[0] === '品目グループ名' || !row[2]) return;

      const longName = String(row[2]);

      items.push({
        rowNumber: i + 1,
        group: row[0],
        code: row[1],
        longName: longName,
        shortName: shortName(longName),
        price: Number(row[3] || 0)
      });

      if(row[0]) groups.add(row[0]);
    });

    document.getElementById('groupPicker').innerHTML =
      '<option value="">選択してください</option>' +
      [...groups].map(g=>`<option value="${g}">${g}</option>`).join('');

    document.getElementById('loadStatus').textContent =
      `読込完了: ${items.length}件`;

    renderCart();
    updateReview();
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('groupPicker').addEventListener('change', function(){
  const group = this.value;
  document.getElementById('itemPicker').innerHTML =
    items.filter(i=>i.group===group)
         .map(i=>`<option value="${i.rowNumber}">${i.shortName}</option>`)
         .join('');
});

document.getElementById('addBtn').addEventListener('click', function(){
  const rowNumber = Number(document.getElementById('itemPicker').value);
  const day = document.getElementById('dayPicker').value;
  const qty = Number(document.getElementById('qtyOne').value);
  const item = items.find(i=>i.rowNumber===rowNumber);
  if(!item || !qty) return;

  let existing = cart.find(c=>c.rowNumber===rowNumber);
  if(!existing){
    existing = {...item, d5:0, d15:0, d25:0};
    cart.push(existing);
  }

  existing['d'+day] += qty;
  document.getElementById('qtyOne').value = 0;

  renderCart();
  updateReview();
});

function removeFromCart(index){
  if(!confirm('この品目を削除しますか？')) return;
  cart.splice(index,1);
  renderCart();
  updateReview();
}

document.querySelectorAll('.quickAdd').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const input = document.getElementById('qtyOne');
    input.value = Number(input.value || 0) + Number(btn.dataset.add);
  });
});

function renderCart(){
  const list = document.getElementById('cartList');
  list.innerHTML = cart.map((c,i)=>{
    const qtyText=[];
    if(c.d5) qtyText.push(`5日:${c.d5}`);
    if(c.d15) qtyText.push(`15日:${c.d15}`);
    if(c.d25) qtyText.push(`25日:${c.d25}`);

    return `<div class="item">
      <strong>${c.shortName}</strong><br>
      <small>${c.group} / ${c.code}</small><br>
      数量: ${qtyText.join(' / ')}
      <button class="deleteBtn" onclick="removeFromCart(${i})">削除</button>
    </div>`;
  }).join('');

  const total = cart.reduce((s,c)=>s+c.price*(c.d5+c.d15+c.d25),0);
  document.getElementById('sumTotal').textContent = yen(total);
}

function updateReview(){
  const body = document.getElementById('reviewBody');
  const total = cart.reduce((s,c)=>s+c.price*(c.d5+c.d15+c.d25),0);

  document.getElementById('reviewCount').textContent = cart.length;
  document.getElementById('reviewTotal').textContent = yen(total);

  const rows=[];
  cart.forEach(c=>{
    if(c.d5) rows.push(`<tr><td>${c.shortName}</td><td>5日</td><td class="num">${c.d5}</td><td class="num">${yen(c.price*c.d5)}</td></tr>`);
    if(c.d15) rows.push(`<tr><td>${c.shortName}</td><td>15日</td><td class="num">${c.d15}</td><td class="num">${yen(c.price*c.d15)}</td></tr>`);
    if(c.d25) rows.push(`<tr><td>${c.shortName}</td><td>25日</td><td class="num">${c.d25}</td><td class="num">${yen(c.price*c.d25)}</td></tr>`);
  });

  body.innerHTML = rows.join('');
  document.getElementById('mailBody').value = buildMailBody();
}

function buildMailBody(){
  const company = document.getElementById('companyName').value || '';
  const total = cart.reduce((s,c)=>s+c.price*(c.d5+c.d15+c.d25),0);

  const lines=['お世話になっております。','','以下の部材を発注いたします。',''];
  cart.forEach((c,i)=>{
    const qtyText=[];
    if(c.d5) qtyText.push(`5日:${c.d5}`);
    if(c.d15) qtyText.push(`15日:${c.d15}`);
    if(c.d25) qtyText.push(`25日:${c.d25}`);
    lines.push(`${i+1}. ${c.shortName}（${qtyText.join(' / ')}）`);
  });
  lines.push('',`合計件数: ${cart.length}`,`合計金額: ${yen(total)}`,'',company);
  return lines.join('\\n');
}

function buildModifiedWorkbook(){
  const wb = XLSX.read(
    XLSX.write(workbook,{type:'array',bookType:'xlsx'}),
    {type:'array'}
  );
  const ws = wb.Sheets[wb.SheetNames[0]];

  const company = document.getElementById('companyName').value || '';
  if(company) ws['C1'] = {t:'s',v:company};

  cart.forEach(c=>{
    ws['E'+c.rowNumber] = {t:'n',v:c.d5||0};
    ws['F'+c.rowNumber] = {t:'n',v:c.d15||0};
    ws['G'+c.rowNumber] = {t:'n',v:c.d25||0};
  });

  return wb;
}

function saveFile(){
  XLSX.writeFile(buildModifiedWorkbook(),'部材発注.xlsx');
}

async function shareFile(){
  const wb = buildModifiedWorkbook();
  const array = XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob = new Blob([array],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file = new File([blob],'部材発注.xlsx',{type:blob.type});

  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    await navigator.share({files:[file],title:'部材発注',text:buildMailBody()});
  }else{
    XLSX.writeFile(wb,'部材発注.xlsx');
  }
}

function launchMail(){
  const subject = '部材発注の件';
  const body = buildMailBody();
  window.location.href =
    `mailto:${FIXED_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

document.getElementById('saveBtn').addEventListener('click', saveFile);
document.getElementById('shareBtn').addEventListener('click', shareFile);
document.getElementById('mailBtn').addEventListener('click', launchMail);
</script>
</body>
</html>
