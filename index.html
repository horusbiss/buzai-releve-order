
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部材拾い出し＋Excel変換 v10.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;padding:0}
.wrap{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}
label{font-weight:bold;margin-top:10px;display:block}
input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #e5e7eb;font-size:16px}
button{background:#111827;color:#fff;font-weight:bold;cursor:pointer}
button.secondary{background:#374151}
button.ghost{background:#fff;color:#111;border:1px solid #e5e7eb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}
.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:12px;font-weight:bold;display:flex;justify-content:space-between}
.review{margin-top:12px;border:1px solid #e5e7eb;border-radius:12px;padding:12px;display:none}
.review table{width:100%;border-collapse:collapse}
.review th,.review td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}
.review .num{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>部材拾い出し＋Excel変換 v10.1</h2>
    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">
    <label>会社名</label>
    <input type="text" id="companyName" placeholder="例：株式会社○○">
    <button onclick="loadExcel()">Excelを読み込む</button>
  </div>

  <div class="card">
    <label>日付</label>
    <select id="dayPicker">
      <option value="5">5日</option>
      <option value="15">15日</option>
      <option value="25">25日</option>
    </select>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <div class="quickBtns">
      <button type="button" class="ghost quickAdd" data-add="5">+5</button>
      <button type="button" class="ghost quickAdd" data-add="10">+10</button>
      <button type="button" class="ghost quickAdd" data-add="100">+100</button>
      <button type="button" class="ghost quickAdd" data-add="200">+200</button>
      <button type="button" class="ghost quickAdd" data-add="305">+305</button>
    </div>

    <button id="addBtn">カートに入れる</button>
  </div>

  <div class="card">
    <h3>カート</h3>
    <div id="cartList"></div>
  </div>

  <div class="card">
    <button class="secondary" onclick="showReview()">確認する</button>
    <div id="reviewBox" class="review">
      <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
        <span>合計件数: <span id="reviewCount">0</span></span>
        <span>合計金額: <span id="reviewTotal">¥0</span></span>
      </div>
      <table>
        <thead>
          <tr><th>品目名</th><th>日付</th><th class="num">数量</th><th class="num">金額</th></tr>
        </thead>
        <tbody id="reviewBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer">
  <span>合計金額</span>
  <span id="sumTotal">¥0</span>
</div>

<script>
let workbook, sheet, items = [], cart = [];

function yen(n){return '¥' + Number(n||0).toLocaleString('ja-JP');}

function loadExcel(){
  const file = document.getElementById('fileInput').files[0];
  const reader = new FileReader();
  reader.onload = function(e){
    workbook = XLSX.read(e.target.result, {type:'array'});
    sheet = workbook.Sheets[workbook.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(sheet, {header:1});

    items = [];
    const groups = new Set();

    data.forEach((row, i)=>{
      if(row[0]==='品目グループ名' || !row[2]) return;
      items.push({
        rowNumber:i+1,
        group:row[0],
        code:row[1],
        name:row[2],
        price:Number(row[3]||0)
      });
      groups.add(row[0]);
    });

    const groupPicker = document.getElementById('groupPicker');
    groupPicker.innerHTML = '<option value="">選択してください</option>' +
      [...groups].map(g=>`<option value="${g}">${g}</option>`).join('');
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('groupPicker').addEventListener('change', function(){
  const group = this.value;
  const itemPicker = document.getElementById('itemPicker');
  itemPicker.innerHTML = items
    .filter(i=>i.group===group)
    .map(i=>`<option value="${i.rowNumber}">${i.name}</option>`)
    .join('');
});

document.getElementById('addBtn').addEventListener('click', function(){
  const rowNumber = Number(document.getElementById('itemPicker').value);
  const day = document.getElementById('dayPicker').value;
  const qty = Number(document.getElementById('qtyOne').value);

  const item = items.find(i=>i.rowNumber===rowNumber);
  if(!item || !qty) return;

  let existing = cart.find(c=>c.rowNumber===rowNumber);
  if(!existing){
    existing = {...item, d5:0, d15:0, d25:0};
    cart.push(existing);
  }
  existing['d'+day] += qty;

  document.getElementById('qtyOne').value = 0;
  renderCart();
});

document.querySelectorAll('.quickAdd').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const input = document.getElementById('qtyOne');
    input.value = Number(input.value||0) + Number(btn.dataset.add);
  });
});

function renderCart(){
  const list = document.getElementById('cartList');
  list.innerHTML = cart.map((c,i)=>{
    const qtyText = [];
    if(c.d5) qtyText.push(`5日:${c.d5}`);
    if(c.d15) qtyText.push(`15日:${c.d15}`);
    if(c.d25) qtyText.push(`25日:${c.d25}`);
    return `<div class="item">
      <strong>${c.name}</strong><br>
      <small>${c.group} / ${c.code}</small><br>
      数量: ${qtyText.join(' / ')}
    </div>`;
  }).join('');

  const total = cart.reduce((s,c)=>s + c.price*(c.d5+c.d15+c.d25),0);
  document.getElementById('sumTotal').textContent = yen(total);
}

function showReview(){
  const box = document.getElementById('reviewBox');
  const body = document.getElementById('reviewBody');
  const count = cart.length;
  const total = cart.reduce((s,c)=>s + c.price*(c.d5+c.d15+c.d25),0);

  document.getElementById('reviewCount').textContent = count;
  document.getElementById('reviewTotal').textContent = yen(total);

  const rows = [];
  cart.forEach(c=>{
    if(c.d5) rows.push(`<tr><td>${c.name}</td><td>5日</td><td class="num">${c.d5}</td><td class="num">${yen(c.price*c.d5)}</td></tr>`);
    if(c.d15) rows.push(`<tr><td>${c.name}</td><td>15日</td><td class="num">${c.d15}</td><td class="num">${yen(c.price*c.d15)}</td></tr>`);
    if(c.d25) rows.push(`<tr><td>${c.name}</td><td>25日</td><td class="num">${c.d25}</td><td class="num">${yen(c.price*c.d25)}</td></tr>`);
  });
  body.innerHTML = rows.join('');
  box.style.display = 'block';
}
</script>
</body>
</html>
