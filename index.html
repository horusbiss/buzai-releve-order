<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部材拾い出し＋Excel変換 v11.2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:0;
  color:#111827;
}
.wrap{
  max-width:860px;
  margin:0 auto;
  padding:16px 16px 150px;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
label{
  font-weight:700;
  margin-top:10px;
  display:block;
}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
  box-sizing:border-box;
}
button{
  background:#111827;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button.secondary{ background:#374151; }
button.ghost{
  background:#fff;
  color:#111;
  border:1px solid #e5e7eb;
}
.small{
  font-size:12px;
  color:#6b7280;
}
.status{
  margin-top:8px;
  font-size:13px;
  color:#166534;
}

/* 日付ボタン */
.dayChoices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}
.dayChoices input{ display:none; }
.dayChoices label{
  margin:0;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  text-align:center;
  font-weight:700;
  background:#fff;
  cursor:pointer;
}
.dayChoices input:checked + label{
  background:#111827;
  color:#fff;
  border-color:#111827;
}

/* カート */
.item{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:10px 12px;
  margin-top:10px;
}
.cartRow{
  display:flex;
  align-items:center;
  gap:10px;
}
.cartName{
  font-weight:700;
  flex:1;
}
.cartQty,.cartAmount{
  font-weight:700;
  white-space:nowrap;
}
.deleteBtnSmall{
  background:#ef4444;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:6px 10px;
  font-weight:700;
  cursor:pointer;
  font-size:12px;
}
.deleteBtnSmall:hover{ background:#dc2626; }

/* 確認一覧 */
.review table{
  width:100%;
  border-collapse:collapse;
}
.review th,.review td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
}
.review .num{ text-align:right; }

/* フッター */
.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid #e5e7eb;
  padding:8px 12px;
}
.footerRow{
  max-width:860px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.summary{
  max-width:860px;
  margin:8px auto 0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
}

/* トースト */
.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:92px;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  transition:opacity .2s ease;
}
.toast.show{ opacity:1; }
</style>
</head>

<body>
<div class="wrap">

  <!-- 手順1 -->
  <div class="card">
    <h2>部材拾い出し＋Excel変換</h2>

    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">

    <label>発注者</label>
    <input type="text" id="orderer" placeholder="例：山田太郎">

    <button onclick="loadExcel()">Excelを読み込む</button>
    <div id="loadStatus" class="status"></div>
  </div>

  <!-- 手順2 -->
  <div class="card">
    <label>日付</label>
    <div class="dayChoices">
      <input type="radio" name="dayPicker" id="day5" value="5" checked>
      <label for="day5">5日</label>
      <input type="radio" name="dayPicker" id="day15" value="15">
      <label for="day15">15日</label>
      <input type="radio" name="dayPicker" id="day25" value="25">
      <label for="day25">25日</label>
    </div>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <button id="addBtn">カートに入れる</button>
  </div>

  <!-- カート -->
  <div class="card">
    <h3>カート</h3>
    <div id="cartList"></div>
  </div>

  <!-- 確認一覧 -->
  <div class="card review">
    <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
      <span>合計件数: <span id="reviewCount">0</span></span>
      <span>合計金額: <span id="reviewTotal">¥0</span></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>発注品目</th>
          <th>日付</th>
          <th class="num">数量</th>
          <th class="num">金額</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>
</div>

<!-- フッター -->
<div class="footer">
  <div class="footerRow">
    <button id="saveBtn" class="secondary">保存</button>
    <button id="shareBtn" class="ghost">ファイル共有</button>
  </div>
  <div class="summary">
    <span>合計金額</span>
    <span id="sumTotal">¥0</span>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let workbook = null;
let items = [];
let cart = [];

function yen(n){
  return '¥' + Number(n || 0).toLocaleString('ja-JP');
}

function getSelectedDay(){
  return document.querySelector('input[name="dayPicker"]:checked').value;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

/* Excel読み込み */
function loadExcel(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){
    alert('Excelファイルを選択してください');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    workbook = XLSX.read(e.target.result, {type:'array'});
    const sheet1 = workbook.Sheets['Sheet1'];
    const sheet2 = workbook.Sheets['Sheet2'];

    const data1 = XLSX.utils.sheet_to_json(sheet1, {header:1});
    const data2 = XLSX.utils.sheet_to_json(sheet2, {header:1});

    items = [];
    const groups = new Set();

    for(let r=1; r<data2.length; r++){
      if(!data2[r][2]) continue;
      items.push({
        sheet1Row: r+2,
        group: data2[r][0],
        shortName: data2[r][3] || data2[r][2],
        price: Number(data1[r+1][3] || 0)
      });
      groups.add(data2[r][0]);
    }

    document.getElementById('groupPicker').innerHTML =
      [...groups].map(g=>`<option value="${g}">${g}</option>`).join('');

    showToast('Excelを読み込みました');
    document.getElementById('loadStatus').textContent = '読込完了';
  };
  reader.readAsArrayBuffer(file);
}

/* 品目更新 */
document.getElementById('groupPicker').addEventListener('change', function(){
  const group = this.value;
  document.getElementById('itemPicker').innerHTML =
    items.filter(i=>i.group===group)
         .map(i=>`<option value="${i.sheet1Row}">${i.shortName}</option>`)
         .join('');
});

/* カート追加 */
document.getElementById('addBtn').addEventListener('click', function(){
  const row = Number(document.getElementById('itemPicker').value);
  const qty = Number(document.getElementById('qtyOne').value);
  const day = getSelectedDay();
  if(!row || !qty) return;

  let item = items.find(i=>i.sheet1Row===row);
  let existing = cart.find(c=>c.sheet1Row===row);
  if(!existing){
    existing = {...item, d5:0, d15:0, d25:0};
    cart.push(existing);
  }
  existing['d'+day]+=qty;
  renderCart();
  updateReview();
  showToast('カートに入れました');
});

/* カート削除 */
function removeFromCart(index){
  cart.splice(index,1);
  renderCart();
  updateReview();
}

/* カート描画 */
function renderCart(){
  const list=document.getElementById('cartList');
  list.innerHTML=cart.map((c,i)=>{
    const totalQty=c.d5+c.d15+c.d25;
    const totalAmt=c.price*totalQty;
    return `<div class="item">
      <div class="cartRow">
        <div class="cartName">${c.shortName}</div>
        <div class="cartQty">${totalQty}</div>
        <div class="cartAmount">${yen(totalAmt)}</div>
        <button class="deleteBtnSmall" onclick="removeFromCart(${i})">削除</button>
      </div>
    </div>`;
  }).join('');

  const total=cart.reduce((s,c)=>s+c.price*(c.d5+c.d15+c.d25),0);
  document.getElementById('sumTotal').textContent=yen(total);
}

/* 確認一覧 */
function updateReview(){
  const body=document.getElementById('reviewBody');
  let count=0,total=0;
  const rows=[];

  cart.forEach(c=>{
    if(c.d5){count+=c.d5; total+=c.price*c.d5; rows.push(`<tr><td>${c.shortName}</td><td>5日</td><td class="num">${c.d5}</td><td class="num">${yen(c.price*c.d5)}</td></tr>`);}
    if(c.d15){count+=c.d15; total+=c.price*c.d15; rows.push(`<tr><td>${c.shortName}</td><td>15日</td><td class="num">${c.d15}</td><td class="num">${yen(c.price*c.d15)}</td></tr>`);}
    if(c.d25){count+=c.d25; total+=c.price*c.d25; rows.push(`<tr><td>${c.shortName}</td><td>25日</td><td class="num">${c.d25}</td><td class="num">${yen(c.price*c.d25)}</td></tr>`);}
  });

  document.getElementById('reviewCount').textContent=count;
  document.getElementById('reviewTotal').textContent=yen(total);
  body.innerHTML=rows.join('');
}

/* Excel保存 */
function buildModifiedWorkbook(){
  const wb=XLSX.read(XLSX.write(workbook,{type:'array',bookType:'xlsx'}),{type:'array'});
  const ws=wb.Sheets['Sheet1'];

  cart.forEach(c=>{
    ws['E'+c.sheet1Row]={t:'n',v:c.d5||0};
    ws['F'+c.sheet1Row]={t:'n',v:c.d15||0};
    ws['G'+c.sheet1Row]={t:'n',v:c.d25||0};
  });

  return wb;
}

document.getElementById('saveBtn').addEventListener('click',()=>{
  XLSX.writeFile(buildModifiedWorkbook(),'提出要部材購入_更新.xlsx');
});

document.getElementById('shareBtn').addEventListener('click',()=>{
  const wb=buildModifiedWorkbook();
  const array=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([array],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const file=new File([blob],'提出要部材購入_更新.xlsx');
  if(navigator.share){
    navigator.share({files:[file],title:'部材発注'});
  }else{
    XLSX.writeFile(wb,'提出要部材購入_更新.xlsx');
  }
});
</script>
</body>
</html>
