
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部材拾い出し＋Excel変換 v11</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;margin:0;padding:0;color:#111827}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 150px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}
label{font-weight:700;margin-top:10px;display:block}
input,select,button,textarea{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #e5e7eb;font-size:16px;box-sizing:border-box}
button{background:#111827;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#374151}
button.ghost{background:#fff;color:#111;border:1px solid #e5e7eb}
.deleteBtn{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px;margin-top:10px;font-weight:700;cursor:pointer;width:100%}
.deleteBtn:hover{background:#dc2626}
.small{font-size:12px;color:#6b7280;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quickBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-top:10px}
.cartRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cartMain{min-width:0;flex:1}
.cartName{font-weight:700;display:block}
.cartQty{font-weight:700;white-space:nowrap;margin-left:auto}
.deleteBtnSmall{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;width:auto;min-width:auto;margin:0;font-size:12px;line-height:1.2}
.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid #e5e7eb;padding:8px 12px;z-index:1000}
.footerRow{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.footerRow button{padding:8px 10px;font-size:14px;min-height:38px}
.summary{max-width:860px;margin:8px auto 0;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;font-size:14px}
.review{margin-top:12px;border:1px solid #e5e7eb;border-radius:12px;padding:12px}
.review table{width:100%;border-collapse:collapse}
.review th,.review td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;vertical-align:top}
.review .num{text-align:right}
.linkBox{margin-top:10px;padding:10px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;word-break:break-all;display:none}
.notice{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.ok{color:#166534}
.err{color:#b91c1c}
@media (max-width:700px){.quickBtns{grid-template-columns:repeat(3,1fr)} .footerRow,.row2{grid-template-columns:1fr} .wrap{padding-bottom:170px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h2>部材拾い出し＋Excel変換</h2>
    <div class="small">
      Sheet1 は提出用です。指定した日の列に数量だけ入れます。<br>
      Sheet2 の品目グループ名・品目名（短縮品目名）をプルダウンに使います。<br>
      保存・共有するExcelでは Sheet1 の塗りつぶし・罫線・書式・既存データを触らず、指定日の数量セルだけ更新します。
    </div>

    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">

    <label>発注者</label>
    <input type="text" id="orderer" placeholder="例：山田太郎">

    <button onclick="loadExcel()">Excelを読み込む</button>
    <div id="loadStatus" class="small" style="margin-top:8px"></div>
    <div id="saveStatus" class="small" style="margin-top:8px"></div>
    <div id="manualLinkBox" class="linkBox"></div>
  </div>

  <div class="card">
    <label>日付</label>
    <select id="dayPicker">
      <option value="5">5日</option>
      <option value="15">15日</option>
      <option value="25">25日</option>
    </select>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <div class="quickBtns">
      <button type="button" class="ghost quickAdd" data-add="5">+5</button>
      <button type="button" class="ghost quickAdd" data-add="10">+10</button>
      <button type="button" class="ghost quickAdd" data-add="100">+100</button>
      <button type="button" class="ghost quickAdd" data-add="200">+200</button>
      <button type="button" class="ghost quickAdd" data-add="305">+305</button>
    </div>

    <button id="addBtn">カートに入れる</button>
    <div class="notice">プルダウン・カート・確認一覧は Sheet2 の短縮品目名を使います。保存するExcelは Sheet1 の元の長い品目名を変更しません。</div>
  </div>

  <div class="card">
    <h3>カート</h3>
    <div id="cartList"></div>
  </div>

  <div class="card review">
    <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
      <span>合計件数: <span id="reviewCount">0</span></span>
      <span>合計金額: <span id="reviewTotal">¥0</span></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>発注品目</th>
          <th>日付</th>
          <th class="num">数量</th>
          <th class="num">金額</th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>
</div>

<div class="footer">
  <div class="footerRow">
    <button id="saveBtn" class="secondary">保存</button>
    <button id="shareBtn" class="ghost">ファイル共有</button>
  </div>
  <div class="summary">
    <span>合計金額</span>
    <span id="sumTotal">¥0</span>
  </div>
</div>

const GROUPS_MASTER = ["保安機", "分岐/分配/混合器", "雑材", "ケーブル", "工具", "樽", "コネクタ", "ユニット", "BOX", "ブースター", "ATT/ﾌｨﾙﾀｰ", "光部材"];

let workbook = null;
let items = ITEMS_MASTER.slice();
let cart = [];
let currentDownloadUrl = null;

function yen(n) {
  return '¥' + Number(n || 0).toLocaleString('ja-JP');
}

function clearLink() {
  const box = document.getElementById('manualLinkBox');
  box.style.display = 'none';
  box.innerHTML = '';
  document.getElementById('saveStatus').textContent = '';
  if (currentDownloadUrl) {
    URL.revokeObjectURL(currentDownloadUrl);
    currentDownloadUrl = null;
  }
}

function showLink(blob, filename) {
  clearLink();
  currentDownloadUrl = URL.createObjectURL(blob);
  const box = document.getElementById('manualLinkBox');
  box.innerHTML = `保存や共有が始まらない場合は、<a href="${currentDownloadUrl}" download="${filename}">ここをタップ</a>`;
  box.style.display = 'block';
}

function loadExcel() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) {
    alert('元のExcelファイルを選択してください。');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      workbook = XLSX.read(e.target.result, {type:'array', cellStyles:true, cellFormula:true});
      document.getElementById('groupPicker').innerHTML =
        '<option value="">選択してください</option>' +
        GROUPS_MASTER.map(g => `<option value="${g}">${g}</option>`).join('');
      document.getElementById('itemPicker').innerHTML = '';
      document.getElementById('loadStatus').innerHTML = `<span class="ok">読込完了:</span> Sheet1提出用 / Sheet2プルダウン用`;
      cart = [];
      renderCart();
      updateReview();
      clearLink();
    } catch(err) {
      document.getElementById('loadStatus').innerHTML = `<span class="err">読み込みエラー:</span> ${err.message}`;
    }
  };
  reader.readAsArrayBuffer(file);
}

document.getElementById('groupPicker').addEventListener('change', function() {
  const group = this.value;
  document.getElementById('itemPicker').innerHTML =
    items
      .filter(i => i.group === group)
      .map(i => `<option value="${i.sheet1Row}">${i.shortName}</option>`)
      .join('');
});

document.getElementById('addBtn').addEventListener('click', function() {
  const sheet1Row = Number(document.getElementById('itemPicker').value);
  const day = document.getElementById('dayPicker').value;
  const qty = Number(document.getElementById('qtyOne').value);
  const item = items.find(i => i.sheet1Row === sheet1Row);
  if (!item || !qty) return;

  let existing = cart.find(c => c.sheet1Row === sheet1Row);
  if (!existing) {
    existing = {
      sheet1Row: item.sheet1Row,
      group: item.group,
      code: item.code,
      longName: item.longName,
      shortName: item.shortName,
      price: 0,
      d5: 0,
      d15: 0,
      d25: 0
    };
    cart.push(existing);
  }

  existing['d' + day] += qty;
  document.getElementById('qtyOne').value = 0;
  renderCart();
  updateReview();
  clearLink();
});

function removeFromCart(index) {
  if (!confirm('この品目を削除しますか？')) return;
  cart.splice(index, 1);
  renderCart();
  updateReview();
  clearLink();
}

document.querySelectorAll('.quickAdd').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById('qtyOne');
    input.value = Number(input.value || 0) + Number(btn.dataset.add);
  });
});

function renderCart() {
  const list = document.getElementById('cartList');
  list.innerHTML = cart.map((c, i) => {
    const qtyText = [];
    if (c.d5) qtyText.push(`5日:${c.d5}`);
    if (c.d15) qtyText.push(`15日:${c.d15}`);
    if (c.d25) qtyText.push(`25日:${c.d25}`);
    const totalQty = (c.d5 || 0) + (c.d15 || 0) + (c.d25 || 0);
    return `<div class="item">
      <div class="cartRow">
        <div class="cartMain">
          <span class="cartName">${c.shortName}</span>
          <small>${qtyText.join(' / ')}</small>
        </div>
        <div class="cartQty">${totalQty}</div>
        <button class="deleteBtnSmall" onclick="removeFromCart(${i})">削除</button>
      </div>
    </div>`;
  }).join('') || '<div class="small">まだ追加されていません。</div>';

  const totalCount = cart.reduce((s, c) => s + (c.d5 + c.d15 + c.d25), 0);
  document.getElementById('sumTotal').textContent = totalCount.toLocaleString('ja-JP');
}

function buildMailBody() {
  const orderer = document.getElementById('orderer').value || '';
  const orderDate = document.getElementById('orderDate').value || '';
  const totalCount = cart.reduce((s, c) => s + (c.d5 + c.d15 + c.d25), 0);

  const lines = [];
  lines.push(`発注者: ${orderer}`);
  lines.push(`発注日: ${orderDate}`);
  lines.push('');
  lines.push('発注品目:');
  cart.forEach((c, i) => {
    if (c.d5) lines.push(`${i+1}. ${c.shortName} / 5日 / 数量: ${c.d5}`);
    if (c.d15) lines.push(`${i+1}. ${c.shortName} / 15日 / 数量: ${c.d15}`);
    if (c.d25) lines.push(`${i+1}. ${c.shortName} / 25日 / 数量: ${c.d25}`);
  });
  lines.push('');
  lines.push(`合計件数: ${totalCount}`);
  return lines.join('\n');
}

function updateReview() {
  const body = document.getElementById('reviewBody');
  const totalCount = cart.reduce((s, c) => s + (c.d5 + c.d15 + c.d25), 0);

  document.getElementById('reviewCount').textContent = totalCount;
  document.getElementById('reviewTotal').textContent = totalCount.toLocaleString('ja-JP');

  const rows = [];
  cart.forEach(c => {
    if (c.d5) rows.push(`<tr><td>${c.shortName}</td><td>5日</td><td class="num">${c.d5}</td><td class="num">-</td></tr>`);
    if (c.d15) rows.push(`<tr><td>${c.shortName}</td><td>15日</td><td class="num">${c.d15}</td><td class="num">-</td></tr>`);
    if (c.d25) rows.push(`<tr><td>${c.shortName}</td><td>25日</td><td class="num">${c.d25}</td><td class="num">-</td></tr>`);
  });

  body.innerHTML = rows.join('') || '<tr><td colspan="4">データがありません。</td></tr>';
}

function buildModifiedWorkbook() {
  if (!workbook) throw new Error('先にExcelを読み込んでください。');
  if (!cart.length) throw new Error('カートが空です。');

  const wb = XLSX.read(XLSX.write(workbook, {type:'array', bookType:'xlsx', cellStyles:true}), {type:'array', cellStyles:true, cellFormula:true});
  const ws = wb.Sheets['Sheet1'] || wb.Sheets[wb.SheetNames[0]];

  // 塗りつぶし、罫線、書式を触らず、数量セルだけ更新
  cart.forEach(c => {
    ws['E' + c.sheet1Row] = Object.assign({}, ws['E' + c.sheet1Row] || {}, {t:'n', v:c.d5 || 0});
    ws['F' + c.sheet1Row] = Object.assign({}, ws['F' + c.sheet1Row] || {}, {t:'n', v:c.d15 || 0});
    ws['G' + c.sheet1Row] = Object.assign({}, ws['G' + c.sheet1Row] || {}, {t:'n', v:c.d25 || 0});
  });

  return wb;
}

function makeFilename() {
  const file = document.getElementById('fileInput').files[0];
  const base = file ? file.name.replace(/\.xlsx$/i, '').replace(/\.xlsm$/i, '') : '提出要部材購入';
  return `${base}_更新.xlsx`;
}

function saveFile() {
  try {
    const wb = buildModifiedWorkbook();
    XLSX.writeFile(wb, makeFilename());
  } catch(err) {
    alert(err.message);
  }
}

async function shareFile() {
  try {
    const wb = buildModifiedWorkbook();
    const filename = makeFilename();
    const array = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([array], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const file = new File([blob], filename, {type: blob.type});

    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      await navigator.share({files:[file], title:'部材発注', text:buildMailBody()});
    } else {
      XLSX.writeFile(wb, filename);
    }
  } catch(err) {
    alert(err.message);
  }
}

document.getElementById('saveBtn').addEventListener('click', saveFile);
document.getElementById('shareBtn').addEventListener('click', shareFile);
