<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部材拾い出し＋Excel変換</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:0;
  color:#111827;
}
.wrap{
  max-width:860px;
  margin:0 auto;
  padding:16px 16px 150px;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
label{
  font-weight:700;
  margin-top:10px;
  display:block;
}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:16px;
  box-sizing:border-box;
}
button{
  cursor:pointer;
}
button.primary{
  background:#2563eb;
  color:#fff;
  font-weight:700;
  border:none;
}
button.primary:hover{
  background:#1d4ed8;
}
button.secondary{
  background:#374151;
  color:#fff;
  font-weight:700;
  border:none;
}
.dayChoices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}
.dayChoices input{ display:none; }
.dayChoices label{
  margin:0;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:12px;
  text-align:center;
  font-weight:700;
  background:#fff;
  cursor:pointer;
}
.dayChoices input:checked + label{
  background:#111827;
  color:#fff;
  border-color:#111827;
}
.review table{
  width:100%;
  border-collapse:collapse;
}
.review th,.review td{
  border-bottom:1px solid #e5e7eb;
  padding:8px;
}
.review .num{ text-align:right; }
.deleteBtnTiny{
  background:#ef4444;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:4px 8px;
  font-size:11px;
  cursor:pointer;
}
.deleteBtnTiny:hover{
  background:#dc2626;
}
.footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.96);
  border-top:1px solid #e5e7eb;
  padding:8px 12px;
}
.footerRow{
  max-width:860px;
  margin:0 auto;
}
.summary{
  max-width:860px;
  margin:8px auto 0;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
}
.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:92px;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:999px;
  font-size:13px;
  opacity:0;
  transition:opacity .2s ease;
}
.toast.show{ opacity:1; }
</style>
</head>

<body>
<div class="wrap">

  <!-- 手順1 -->
  <div class="card">
    <h2>発注くん</h2>

    <label>元のExcelファイル</label>
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">

    <label>発注者</label>
    <input type="text" id="orderer" placeholder="例：山田太郎">

    <button class="primary" onclick="loadExcel()">Excelを読み込む</button>
  </div>

  <!-- 手順2 -->
  <div class="card">
    <label>日付</label>
    <div class="dayChoices">
      <input type="radio" name="dayPicker" id="day5" value="5" checked>
      <label for="day5">5日</label>
      <input type="radio" name="dayPicker" id="day15" value="15">
      <label for="day15">15日</label>
      <input type="radio" name="dayPicker" id="day25" value="25">
      <label for="day25">25日</label>
    </div>

    <label>品目グループ名</label>
    <select id="groupPicker"></select>

    <label>品目名</label>
    <select id="itemPicker"></select>

    <label>数量</label>
    <input type="number" id="qtyOne" value="0">

    <button id="addBtn" class="primary">カートに入れる</button>
  </div>

  <!-- 確認一覧 -->
  <div class="card review">
    <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:10px">
      <span>合計件数: <span id="reviewCount">0</span></span>
      <span>合計金額: <span id="reviewTotal">¥0</span></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>発注品目</th>
          <th>日付</th>
          <th class="num">数量</th>
          <th class="num">金額</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="reviewBody"></tbody>
    </table>
  </div>
</div>

<!-- フッター -->
<div class="footer">
  <div class="footerRow">
    <button id="saveBtn" class="secondary">Excel保存</button>
  </div>
  <div class="summary">
    <span>合計金額</span>
    <span id="sumTotal">¥0</span>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let workbook = null;
let items = [];
let orderList = [];

function yen(n){
  return '¥' + Number(n || 0).toLocaleString('ja-JP');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

function getSelectedDay(){
  return document.querySelector('input[name="dayPicker"]:checked').value;
}

/* Excel読み込み */
function loadExcel(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){
    alert('Excelファイルを選択してください');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    workbook = XLSX.read(e.target.result, {type:'array'});
    const sheet1 = workbook.Sheets['Sheet1'];
    const sheet2 = workbook.Sheets['Sheet2'];

    const data1 = XLSX.utils.sheet_to_json(sheet1, {header:1});
    const data2 = XLSX.utils.sheet_to_json(sheet2, {header:1});

    items = [];
    const groups = new Set();

    for(let r=1; r<data2.length; r++){
      if(!data2[r][2]) continue;
      items.push({
        sheet1Row: r+2,
        group: data2[r][0],
        shortName: data2[r][3] || data2[r][2],
        price: Number(data1[r+1][3] || 0)
      });
      groups.add(data2[r][0]);
    }

    document.getElementById('groupPicker').innerHTML =
      [...groups].map(g=>`<option value="${g}">${g}</option>`).join('');

    showToast('Excelを読み込みました');
  };
  reader.readAsArrayBuffer(file);
}

/* 品目更新 */
document.getElementById('groupPicker').addEventListener('change', function(){
  const group = this.value;
  document.getElementById('itemPicker').innerHTML =
    items.filter(i=>i.group===group)
         .map(i=>`<option value="${i.sheet1Row}">${i.shortName}</option>`)
         .join('');
});

/* 追加 */
document.getElementById('addBtn').addEventListener('click', function(){
  const row = Number(document.getElementById('itemPicker').value);
  const qty = Number(document.getElementById('qtyOne').value);
  const day = getSelectedDay();
  if(!row || !qty) return;

  const item = items.find(i=>i.sheet1Row===row);

  let existing = orderList.find(o =>
    o.sheet1Row === row && o.day === day
  );

  if(existing){
    existing.qty += qty;
  }else{
    orderList.push({
      sheet1Row: row,
      shortName: item.shortName,
      price: item.price,
      day: day,
      qty: qty
    });
  }

  updateReview();
  showToast('確認一覧に追加しました');
  document.getElementById('qtyOne').value = 0;
});

/* 削除 */
function removeFromReview(index){
  orderList.splice(index,1);
  updateReview();
}

/* 確認一覧 */
function updateReview(){
  const body=document.getElementById('reviewBody');
  let count=0,total=0;

  body.innerHTML = orderList.map((o,i)=>{
    const amount=o.price*o.qty;
    count+=o.qty;
    total+=amount;

    return `
      <tr>
        <td>${o.shortName}</td>
        <td>${o.day}日</td>
        <td class="num">${o.qty}</td>
        <td class="num">${yen(amount)}</td>
        <td><button class="deleteBtnTiny" onclick="removeFromReview(${i})">削除</button></td>
      </tr>
    `;
  }).join('');

  document.getElementById('reviewCount').textContent=count;
  document.getElementById('reviewTotal').textContent=yen(total);
  document.getElementById('sumTotal').textContent=yen(total);
}

/* Excel保存 */
function buildModifiedWorkbook(){
  const wb=XLSX.read(
    XLSX.write(workbook,{type:'array',bookType:'xlsx'}),
    {type:'array'}
  );
  const ws=wb.Sheets['Sheet1'];

  orderList.forEach(o=>{
    const col = o.day==='5' ? 'E' : o.day==='15' ? 'F' : 'G';
    ws[col+o.sheet1Row]={t:'n',v:o.qty};
  });

  return wb;
}

document.getElementById('saveBtn').addEventListener('click',()=>{
  XLSX.writeFile(buildModifiedWorkbook(),'提出要部材購入_更新.xlsx');
});
</script>
</body>
</html>
