<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>発注君</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0}
.wrap{max-width:600px;margin:auto;padding:10px}
.card{background:#fff;padding:12px;margin-bottom:10px;border-radius:10px}
button{width:100%;padding:12px;margin-top:6px;border:none;border-radius:8px;font-weight:bold}
.primary{background:#2563eb;color:#fff}
.quick{display:flex;gap:5px;margin-top:6px}
.quick button{flex:1;background:#eee}
.day button{flex:1}
.table td{border-bottom:1px solid #ddd;padding:6px}
.delete{background:#ef4444;color:#fff;padding:4px 6px;font-size:12px}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h2 style="text-align:center;color:#ff8c00;-webkit-text-stroke:1px #000;">発注君</h2>

<input type="file" id="file">
<input id="name" placeholder="発注者">

<button class="primary" onclick="loadExcel()">Excel読込</button>
</div>

<div class="card">

<div class="day">
<button onclick="setDay(5)">5日</button>
<button onclick="setDay(15)">15日</button>
<button onclick="setDay(25)">25日</button>
</div>

<select id="group"></select>
<select id="item"></select>

<input id="qty" type="number" value="0">

<div class="quick">
<button onclick="addQty(5)">+5</button>
<button onclick="addQty(10)">+10</button>
<button onclick="addQty(20)">+20</button>
<button onclick="addQty(100)">+100</button>
<button onclick="addQty(305)">+305</button>
</div>

<button class="primary" onclick="add()">カートに入れる</button>

</div>

<div class="card">
<div>件数:<span id="count">0</span> 金額:<span id="total">0</span></div>

<table class="table" id="list"></table>
</div>

<button class="primary" onclick="share()">共有</button>

</div>

<script>

let wb, items=[], list=[], day=5

function setDay(d){day=d}

function addQty(n){
let q=document.getElementById("qty")
q.value=Number(q.value)+n
}

function loadExcel(){
let file=document.getElementById("file").files[0]
let r=new FileReader()

r.onload=e=>{
wb=XLSX.read(e.target.result,{type:"array"})
let s1=wb.Sheets["Sheet1"]
let s2=wb.Sheets["Sheet2"]

let d1=XLSX.utils.sheet_to_json(s1,{header:1})
let d2=XLSX.utils.sheet_to_json(s2,{header:1})

items=[]
let groups=new Set()

for(let i=1;i<d2.length;i++){
if(!d2[i][2])continue
items.push({
row:i+2,
group:d2[i][0],
name:d2[i][3]||d2[i][2],
price:Number(d1[i+1][3]||0)
})
groups.add(d2[i][0])
}

let g=document.getElementById("group")
g.innerHTML='<option value="">選択</option>'
groups.forEach(v=>{
g.innerHTML+=`<option>${v}</option>`
})

alert("読込OK")
}

r.readAsArrayBuffer(file)
}

document.getElementById("group").onchange=e=>{
let g=e.target.value
let i=document.getElementById("item")
i.innerHTML='<option value="">選択</option>'

items.filter(x=>x.group==g).forEach(x=>{
i.innerHTML+=`<option value="${x.row}">${x.name}</option>`
})
}

function add(){
let row=Number(item.value)
let qty=Number(qty.value)

if(!row||qty<=0){alert("入力不足");return}

let it=items.find(x=>x.row==row)

let ex=list.find(x=>x.row==row&&x.day==day)

if(ex)ex.qty+=qty
else list.push({row,name:it.name,price:it.price,day,qty})

render()
}

function remove(i){
list.splice(i,1)
render()
}

function render(){
let html=""
let c=0,t=0

list.forEach((x,i)=>{
let m=x.price*x.qty
c+=x.qty
t+=m

html+=`<tr>
<td>${x.name}</td>
<td>${x.day}</td>
<td>${x.qty}</td>
<td>${m}</td>
<td><button class="delete" onclick="remove(${i})">削除</button></td>
</tr>`
})

document.getElementById("list").innerHTML=html
document.getElementById("count").innerText=c
document.getElementById("total").innerText=t
}

function build(){

// ⭐ ここが超重要（崩れ対策）
let ws=wb.Sheets["Sheet1"]

list.forEach(x=>{
let col = x.day==5?"E":x.day==15?"F":"G"
let cell=col+x.row

if(!ws[cell])ws[cell]={}

ws[cell].v=x.qty
ws[cell].t='n'
})

return wb
}

async function share(){

if(!wb){alert("未読込");return}
if(list.length==0){alert("空");return}

let w=build()

let data=XLSX.write(w,{bookType:"xlsx",type:"array"})
let blob=new Blob([data])
let file=new File([blob],"発注.xlsx")

if(navigator.share){
await navigator.share({files:[file]})
}else{
XLSX.writeFile(w,"発注.xlsx")
}

}

</script>

</body>
</html>
