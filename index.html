
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>部材拾い出し＋Excel変換 一体版 v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--danger:#b91c1c;--info:#1d4ed8;--soft:#eef2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 6px}
input[type="text"],input[type="file"],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{border:none;border-radius:10px;background:var(--accent);color:#fff;padding:11px 14px;cursor:pointer;font-weight:700}
button.secondary{background:#374151}
button.ghost{background:#fff;color:#111;border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:12px;color:var(--muted)}
.status{font-size:13px;margin-top:10px}
.ok{color:var(--ok)} .danger{color:var(--danger)} .info{color:var(--info)}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}
.footerBar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.summaryBox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mini{background:#f9fafb;border:1px solid var(--line);border-radius:12px;padding:10px}
.mini .k{font-size:12px;color:var(--muted)} .mini .v{font-size:18px;font-weight:800}
.listWrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead th{position:sticky;top:0;background:#f9fafb;z-index:1}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th.num,td.num{text-align:right}
td input.qtyEdit{width:76px;text-align:right;padding:8px}
.preview{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.hide{display:none}
.pickerGrid{display:grid;grid-template-columns:1fr 1fr 140px 120px auto;gap:8px;align-items:end}
.notice{margin-top:10px;padding:10px 12px;border:1px solid #c7d2fe;background:var(--soft);border-radius:12px;font-size:13px}
tr.flash{background:#ecfeff}
@media (max-width:980px){.grid{grid-template-columns:1fr}.summaryBox{grid-template-columns:repeat(2,1fr)}.pickerGrid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>部材拾い出し＋Excel変換 一体版</h1>
<div class="sub">A列の品目グループ名とC列の品目名をプルダウンで選び、日付も 5日 / 15日 / 25日 から選択。選んだ日付の列だけに数量を入れます。</div>

<div class="grid">
<div class="card">
<div class="pill">手順 1</div>
<label for="xlsxFile">元のExcelファイル（.xlsx）</label>
<input type="file" id="xlsxFile" accept=".xlsx" />

<div class="pill" style="margin-top:14px;">手順 2</div>
<label for="companyName">会社名</label>
<input type="text" id="companyName" placeholder="例：株式会社○○" />

<div class="footerBar">
<button id="loadBtn">Excelを読み込む</button>
<button id="clearBtn" class="ghost">数量を全部クリア</button>
</div>

<div id="loadStatus" class="status"></div>

<div class="summaryBox">
<div class="mini"><div class="k">読込件数</div><div class="v" id="sumItems">0</div></div>
<div class="mini"><div class="k">拾い出し件数</div><div class="v" id="sumSelected">0</div></div>
<div class="mini"><div class="k">概算合計</div><div class="v" id="sumTotal">¥0</div></div>
<div class="mini"><div class="k">会社名</div><div class="v" id="sumCompany">-</div></div>
</div>

<div class="pill" style="margin-top:14px;">手順 4</div>
<div class="footerBar">
<button id="downloadExcelBtn" disabled>提出用Excelを書き出す</button>
<button id="downloadCsvBtn" class="secondary" disabled>拾い出しCSV</button>
</div>
<div class="small">画面では品目名の頭に番号を付けます。ExcelとCSVへ書き出すときは番号を消して元の品目名で出力します。</div>

<div class="preview hide" id="previewBox">
<table>
<thead><tr><th>グループ</th><th>品目コード</th><th>品目名</th><th class="num">5日</th><th class="num">15日</th><th class="num">25日</th></tr></thead>
<tbody id="previewBody"></tbody>
</table>
</div>
</div>

<div class="card">
<div class="pill">手順 3</div>
<div class="pickerGrid" style="margin-top:10px;">
<div>
<label for="groupPicker">品目グループ名（A列）</label>
<select id="groupPicker"><option value="">先にExcelを読み込んでください</option></select>
</div>
<div>
<label for="itemPicker">品目名（C列）</label>
<select id="itemPicker"><option value="">先にグループを選んでください</option></select>
</div>
<div>
<label for="dayPicker">日付</label>
<select id="dayPicker">
  <option value="5">5日</option>
  <option value="15">15日</option>
  <option value="25">25日</option>
</select>
</div>
<div>
<label for="qtyOne">数量</label>
<input type="text" id="qtyOne" inputmode="numeric" placeholder="0">
</div>
<div>
<label>&nbsp;</label>
<button id="addBtn">拾い出しに追加</button>
</div>
</div>

<div id="mergeNotice" class="notice hide"></div>

<div class="listWrap" style="margin-top:12px;">
<table>
<thead><tr><th>グループ</th><th>品目コード</th><th>品目名</th><th class="num">単価</th><th class="num">5日</th><th class="num">15日</th><th class="num">25日</th><th class="num">行合計</th><th>操作</th></tr></thead>
<tbody id="pickedBody"></tbody>
</table>
</div>
<div class="small" style="margin-top:8px;">同じ品目を追加すると、新しい行は作らず既存行に数量を加算します。</div>
</div>
</div>
</div>

<script>
let originalWorkbook=null;
let sheet1Name='Sheet1';
let sheet2Name='Sheet2';
let allItems=[];
let pickedItems=[];
let lastFlashRow=null;

function yen(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;const n=Number(String(v).replace(/[,\s]/g,''));return Number.isFinite(n)?n:0}
function parseRows(sheet){return XLSX.utils.sheet_to_json(sheet,{header:1,defval:''})}
function setCell(sheet,addr,obj){sheet[addr]=obj;const range=XLSX.utils.decode_range(sheet['!ref']||'A1:A1');const cell=XLSX.utils.decode_cell(addr);if(cell.r>range.e.r)range.e.r=cell.r;if(cell.c>range.e.c)range.e.c=cell.c;if(cell.r<range.s.r)range.s.r=cell.r;if(cell.c<range.s.c)range.s.c=cell.c;sheet['!ref']=XLSX.utils.encode_range(range)}
function findSheetNames(workbook){const names=workbook.SheetNames;const s1=names.find(n=>/^sheet1$/i.test(n))||names[0];const s2=names.find(n=>/^sheet2$/i.test(n))||names[1]||names[0];return{s1,s2}}
function findCompanyCell(sheet){const rows=parseRows(sheet);for(let r=0;r<Math.min(rows.length,8);r++){for(let c=0;c<Math.min((rows[r]||[]).length,8);c++){const v=String(rows[r][c]??'');if(v.includes('ここに会社名'))return XLSX.utils.encode_cell({r,c})}}return 'C1'}
function findTotalCell(sheet){const rows=parseRows(sheet);for(let r=0;r<Math.min(rows.length,8);r++){for(let c=0;c<Math.min((rows[r]||[]).length,8);c++){const v=String(rows[r][c]??'');if(v.includes('¥')||v.includes('￥'))return XLSX.utils.encode_cell({r,c})}}return 'B1'}
function buildItemsFromSheet1(sheet){
  const rows=parseRows(sheet);const out=[];let displayNo=1;
  for(let i=1;i<rows.length;i++){
    const group=rows[i][0], code=rows[i][1], name=rows[i][2], price=rows[i][3];
    if(String(name).trim()==='') continue;
    out.push({rowNumber:i+1,group:String(group??''),code:String(code??''),rawName:String(name??''),displayName:displayNo+'. '+String(name??''),price:num(price)});
    displayNo++;
  }
  return out;
}
function refreshSummary(){
  const total=pickedItems.reduce((s,x)=>s+x.price*((x.d5||0)+(x.d15||0)+(x.d25||0)),0);
  document.getElementById('sumItems').textContent=allItems.length;
  document.getElementById('sumSelected').textContent=pickedItems.length;
  document.getElementById('sumTotal').textContent=yen(total);
  document.getElementById('sumCompany').textContent=document.getElementById('companyName').value.trim()||'-';
  document.getElementById('downloadExcelBtn').disabled=!originalWorkbook||pickedItems.length===0;
  document.getElementById('downloadCsvBtn').disabled=pickedItems.length===0;
  const previewBody=document.getElementById('previewBody');
  const previewBox=document.getElementById('previewBox');
  previewBody.innerHTML=pickedItems.map(x=>`<tr><td>${esc(x.group)}</td><td>${esc(x.code)}</td><td>${esc(x.displayName)}</td><td class="num">${x.d5||''}</td><td class="num">${x.d15||''}</td><td class="num">${x.d25||''}</td></tr>`).join('');
  previewBox.classList.toggle('hide',pickedItems.length===0);
}
function renderGroupPicker(){
  const groups=[...new Set(allItems.map(x=>x.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  const sel=document.getElementById('groupPicker');
  sel.innerHTML='<option value="">選んでください</option>'+groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  document.getElementById('itemPicker').innerHTML='<option value="">先にグループを選んでください</option>';
}
function renderItemPicker(){
  const group=document.getElementById('groupPicker').value;
  const list=allItems.filter(x=>x.group===group);
  const sel=document.getElementById('itemPicker');
  sel.innerHTML='<option value="">選んでください</option>'+list.map(x=>`<option value="${x.rowNumber}">${esc(x.displayName)}</option>`).join('');
}
function showMergeNotice(html){
  const box=document.getElementById('mergeNotice');
  box.innerHTML=html;
  box.classList.remove('hide');
}
function hideMergeNotice(){
  document.getElementById('mergeNotice').classList.add('hide');
}
function renderPickedTable(){
  const body=document.getElementById('pickedBody');
  body.innerHTML=pickedItems.map((x,idx)=>`<tr id="picked-row-${idx}" class="${lastFlashRow===idx?'flash':''}"><td>${esc(x.group)}</td><td>${esc(x.code)}</td><td>${esc(x.displayName)}</td><td class="num">${yen(x.price)}</td><td class="num"><input class="qtyEdit" data-idx="${idx}" data-day="5" value="${x.d5||''}" inputmode="numeric"></td><td class="num"><input class="qtyEdit" data-idx="${idx}" data-day="15" value="${x.d15||''}" inputmode="numeric"></td><td class="num"><input class="qtyEdit" data-idx="${idx}" data-day="25" value="${x.d25||''}" inputmode="numeric"></td><td class="num">${yen(x.price*((x.d5||0)+(x.d15||0)+(x.d25||0)))}</td><td><button class="ghost delBtn" data-idx="${idx}">削除</button></td></tr>`).join('');
  body.querySelectorAll('.qtyEdit').forEach(el=>{el.addEventListener('input',e=>{const idx=Number(e.target.dataset.idx);const day=e.target.dataset.day;const n=Math.max(0,parseInt(e.target.value||'0',10)||0);if(day==='5')pickedItems[idx].d5=n;if(day==='15')pickedItems[idx].d15=n;if(day==='25')pickedItems[idx].d25=n;lastFlashRow=idx;renderPickedTable();refreshSummary();setTimeout(()=>{lastFlashRow=null;renderPickedTable();},450);})});
  body.querySelectorAll('.delBtn').forEach(el=>{el.addEventListener('click',e=>{const idx=Number(e.target.dataset.idx);pickedItems.splice(idx,1);lastFlashRow=null;renderPickedTable();refreshSummary();})});
}
function loadWorkbook(){
  const file=document.getElementById('xlsxFile').files[0];
  const status=document.getElementById('loadStatus');
  if(!file){status.innerHTML='<span class="danger">元のExcelファイルを選択してください。</span>';return;}
  status.textContent='読み込み中…';
  const reader=new FileReader();
  reader.onload=(e)=>{try{
    const data=new Uint8Array(e.target.result);
    originalWorkbook=XLSX.read(data,{type:'array',cellFormula:true,cellStyles:true});
    const names=findSheetNames(originalWorkbook); sheet1Name=names.s1; sheet2Name=names.s2;
    const sheet1=originalWorkbook.Sheets[sheet1Name];
    allItems=buildItemsFromSheet1(sheet1);
    pickedItems=[];
    lastFlashRow=null;
    renderGroupPicker(); renderPickedTable(); refreshSummary(); hideMergeNotice();
    status.innerHTML=`<span class="ok">読込完了。</span> ${sheet1Name} から ${allItems.length} 件読み込みました。`;
  }catch(err){status.innerHTML=`<span class="danger">エラー: ${esc(err.message)}</span>`;}}
  reader.readAsArrayBuffer(file);
}
function addPickedItem(){
  const itemValue=document.getElementById('itemPicker').value;
  const day=document.getElementById('dayPicker').value;
  const qty=Math.max(0,parseInt(document.getElementById('qtyOne').value||'0',10)||0);

  if(!itemValue){alert('品目名を選んでください。');return;}
  if(qty===0){alert('数量を入れてください。');return;}

  const rowNumber=Number(itemValue);
  const base=allItems.find(x=>x.rowNumber===rowNumber);
  if(!base){alert('品目が見つかりません。');return;}

  const existsIndex=pickedItems.findIndex(x=>x.rowNumber===base.rowNumber);
  if(existsIndex>=0){
    if(day==='5') pickedItems[existsIndex].d5 += qty;
    if(day==='15') pickedItems[existsIndex].d15 += qty;
    if(day==='25') pickedItems[existsIndex].d25 += qty;
    lastFlashRow=existsIndex;
    showMergeNotice(`<span class="info">同じ品目がすでにあるため、既存行に加算しました。</span><br>${esc(base.displayName)}<br>${day}日へ ${qty} 追加`);
  } else {
    pickedItems.push({
      rowNumber:base.rowNumber,group:base.group,code:base.code,rawName:base.rawName,displayName:base.displayName,price:base.price,
      d5: day==='5' ? qty : 0,
      d15: day==='15' ? qty : 0,
      d25: day==='25' ? qty : 0
    });
    lastFlashRow=pickedItems.length-1;
    showMergeNotice(`<span class="info">追加しました。</span><br>${esc(base.displayName)}<br>${day}日へ ${qty} 入力`);
  }

  document.getElementById('qtyOne').value='';
  renderPickedTable();
  refreshSummary();
  const tr=document.getElementById('picked-row-'+lastFlashRow);
  if(tr){tr.scrollIntoView({behavior:'smooth',block:'nearest'});}
  setTimeout(()=>{lastFlashRow=null;renderPickedTable();},700);
}
function clearAllQty(){pickedItems=[]; lastFlashRow=null; renderPickedTable(); refreshSummary(); hideMergeNotice()}
function writeWorkbookAndDownload(){
  if(!originalWorkbook){alert('先にExcelを読み込んでください。');return;}
  const wb=XLSX.read(XLSX.write(originalWorkbook,{type:'array',bookType:'xlsx'}),{type:'array',cellFormula:true,cellStyles:true});
  const sheet1=wb.Sheets[sheet1Name], sheet2=wb.Sheets[sheet2Name];
  allItems.forEach(item=>{setCell(sheet1,'E'+item.rowNumber,{t:'n',v:0});setCell(sheet1,'F'+item.rowNumber,{t:'n',v:0});setCell(sheet1,'G'+item.rowNumber,{t:'n',v:0});sheet1['H'+item.rowNumber]={t:'n',f:`IFERROR(D${item.rowNumber}*SUM(E${item.rowNumber}:G${item.rowNumber}),0)`};});
  pickedItems.forEach(item=>{setCell(sheet1,'E'+item.rowNumber,{t:'n',v:item.d5||0});setCell(sheet1,'F'+item.rowNumber,{t:'n',v:item.d15||0});setCell(sheet1,'G'+item.rowNumber,{t:'n',v:item.d25||0});});
  const maxRows=Math.max(pickedItems.length+5,300);
  for(let r=2;r<=maxRows;r++){['A','B','C','D','E','F'].forEach(col=>setCell(sheet2,col+r,{t:'s',v:''}));}
  pickedItems.forEach((x,idx)=>{const r=idx+2; const totalQty=(x.d5||0)+(x.d15||0)+(x.d25||0); setCell(sheet2,'A'+r,{t:'s',v:x.group}); setCell(sheet2,'B'+r,{t:'s',v:x.rawName}); setCell(sheet2,'C'+r,{t:'n',v:totalQty});});
  const companyCell=findCompanyCell(sheet1), totalCell=findTotalCell(sheet1), companyName=document.getElementById('companyName').value.trim();
  if(companyName){setCell(sheet1,companyCell,{t:'s',v:companyName});}
  sheet1[totalCell]={t:'n',f:'SUM(H:H)'};
  const baseName=(document.getElementById('xlsxFile').files[0]?.name||'提出要部材購入').replace(/\.xlsx$/i,'');
  XLSX.writeFile(wb, `${baseName}_${companyName||'会社名なし'}_更新.xlsx`);
}
function downloadCsv(){
  if(!pickedItems.length) return;
  const header=['品目グループ名','品目コード','品目名','単価','5日数量','15日数量','25日数量','行合計'];
  const rows=pickedItems.map(x=>[x.group,x.code,x.rawName,x.price,x.d5,x.d15,x.d25,x.price*((x.d5||0)+(x.d15||0)+(x.d25||0))]);
  const csv=[header,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='拾い出し一覧.csv'; a.click(); URL.revokeObjectURL(a.href);
}
document.getElementById('loadBtn').addEventListener('click',loadWorkbook);
document.getElementById('clearBtn').addEventListener('click',clearAllQty);
document.getElementById('groupPicker').addEventListener('change',renderItemPicker);
document.getElementById('addBtn').addEventListener('click',addPickedItem);
document.getElementById('downloadExcelBtn').addEventListener('click',writeWorkbookAndDownload);
document.getElementById('downloadCsvBtn').addEventListener('click',downloadCsv);
document.getElementById('companyName').addEventListener('input',refreshSummary);
</script>
</body>
</html>
